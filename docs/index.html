<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>字卡 — Карточки китайского</title>
<meta name="description" content="Флэш-карточки китайского: иероглиф, пиньинь, перевод. HSK 1–3, тесты, статистика.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="字卡">
<meta name="theme-color" content="#6e1b2b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 字卡 — азиатский стиль: рисовая бумага, тушь, киноварь, бордо, золото */
:root {
  --paper: #f4ead6; --paper-2: #ecdfc3; --paper-3: #e1cfab;
  --card: #fbf6ea;
  --ink: #2b1d18; --ink-2: #5c463c; --ink-3: #8e7a6b;
  --vermilion: #c4371f; --vermilion-2: #e0502f;
  --bordeaux: #6e1b2b; --bordeaux-2: #8c2439; --bordeaux-3: #4f1220;
  --gold: #c49a3c; --gold-2: #e3c170; --gold-3: #f1dea6;
  --jade: #3c7d5c; --jade-2: #5aa37c;
  --ok-bg: rgba(60, 125, 92, .16); --bad-bg: rgba(196, 55, 31, .16); --half-bg: rgba(196, 154, 60, .22);
  --line: rgba(43, 29, 24, .14); --line-2: rgba(43, 29, 24, .26);
  --shadow: 0 6px 20px rgba(70, 35, 20, .16);
  --tab-h: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --noise-op: .45;
  --font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif", Georgia, "Times New Roman", serif;
  --hanzi: "Songti SC", "STSong", "Kaiti SC", "STKaiti", "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Noto Sans CJK SC", serif;
  color-scheme: light;
}
:root[data-theme="dark"], :root.dark-vars {
  --paper: #15100f; --paper-2: #221617; --paper-3: #301d1f;
  --card: #241719;
  --ink: #f1e6d1; --ink-2: #cfbda5; --ink-3: #9c8979;
  --vermilion: #e2492f; --vermilion-2: #f06347;
  --bordeaux: #7d2032; --bordeaux-2: #9b2b42; --bordeaux-3: #4a1220;
  --gold: #d2ad55; --gold-2: #e9cd82; --gold-3: #6a5422;
  --jade: #5fb08a; --jade-2: #7fc8a4;
  --ok-bg: rgba(95, 176, 138, .18); --bad-bg: rgba(226, 73, 47, .2); --half-bg: rgba(210, 173, 85, .22);
  --line: rgba(241, 230, 209, .13); --line-2: rgba(241, 230, 209, .26);
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  --noise-op: .22;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15100f; --paper-2: #221617; --paper-3: #301d1f;
    --card: #241719;
    --ink: #f1e6d1; --ink-2: #cfbda5; --ink-3: #9c8979;
    --vermilion: #e2492f; --vermilion-2: #f06347;
    --bordeaux: #7d2032; --bordeaux-2: #9b2b42; --bordeaux-3: #4a1220;
    --gold: #d2ad55; --gold-2: #e9cd82; --gold-3: #6a5422;
    --jade: #5fb08a; --jade-2: #7fc8a4;
    --ok-bg: rgba(95, 176, 138, .18); --bad-bg: rgba(226, 73, 47, .2); --half-bg: rgba(210, 173, 85, .22);
    --line: rgba(241, 230, 209, .13); --line-2: rgba(241, 230, 209, .26);
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    --noise-op: .22;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.4; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--noise-op);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 80% at 50% -10%, rgba(196, 154, 60, .16), transparent 60%), radial-gradient(90% 60% at 50% 110%, rgba(110, 27, 43, .18), transparent 60%);
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--bordeaux); }
::selection { background: var(--gold-3); }

#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#view { flex: 1; padding: calc(var(--safe-t) + 14px) 16px calc(var(--tab-h) + var(--safe-b) + 24px); animation: fade .22s ease-out; }
body.no-tabs #view { padding-bottom: calc(var(--safe-b) + 24px); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── нижняя навигация ── */
#tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; z-index: 20;
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: flex;
  background: linear-gradient(180deg, var(--bordeaux-2), var(--bordeaux-3)); border-top: 2px solid var(--gold);
  box-shadow: 0 -6px 20px rgba(40, 10, 15, .25);
}
body.no-tabs #tabbar { display: none; }
.tab {
  flex: 1; border: 0; background: transparent; color: rgba(255, 238, 215, .62); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 0 4px; transition: color .15s;
}
.tab .ico { font-family: var(--hanzi); font-size: 22px; line-height: 1.1; font-weight: 400; }
.tab.active { color: var(--gold-2); }
.tab.active .ico { text-shadow: 0 0 12px rgba(227, 193, 112, .6); }
.tab:active { transform: scale(.94); }

/* ── типографика ── */
.vh { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.vh .grow { flex: 1; min-width: 0; }
.title { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0; color: var(--ink); letter-spacing: .01em; }
.sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.h2 { font-family: var(--serif); font-size: 18px; margin: 22px 0 10px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
.muted { color: var(--ink-3); font-weight: 400; }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; line-height: 1.45; }
.flabel { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
.mt { margin-top: 14px; } .mt0 { margin-top: 0 !important; } .mb { margin-bottom: 14px; }
.empty { padding: 22px 14px; text-align: center; color: var(--ink-3); font-size: 14px; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty.gold { color: var(--ink-2); border-color: var(--gold); background: linear-gradient(180deg, rgba(227,193,112,.12), transparent); font-family: var(--serif); font-size: 16px; }
.warn { background: var(--half-bg); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

.seal {
  flex: none; width: 40px; height: 40px; border-radius: 6px; background: var(--vermilion); color: #fff6e8; font-family: var(--hanzi);
  display: grid; place-items: center; font-size: 22px; font-weight: 700; transform: rotate(-5deg);
  box-shadow: inset 0 0 0 2px rgba(255, 246, 232, .55), inset 0 0 0 4px var(--vermilion), 0 3px 8px rgba(196, 55, 31, .35);
}
.seal.big { width: 96px; height: 96px; font-size: 58px; border-radius: 14px; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  font-size: 20px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.icon-btn:active { transform: scale(.94); }

/* ── панели ── */
.panel { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.panel.ornate::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--gold); border-radius: 12px; opacity: .55; pointer-events: none; }
.panel.ornate::after {
  content: ""; position: absolute; right: 12px; top: 12px; width: 14px; height: 14px; opacity: .55; pointer-events: none;
  border-top: 2px solid var(--gold); border-right: 2px solid var(--gold);
}
.hero { padding: 18px 16px; background: linear-gradient(160deg, var(--card), var(--paper-2)); }
.hero-greet { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 10px; }
.hero-row { display: flex; gap: 8px; }
.hero-row > div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: rgba(110, 27, 43, .06); }
.hero-row .v, .tile .v { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--bordeaux); line-height: 1.1; }
.hero-row .l, .tile .l { font-size: 11px; color: var(--ink-3); margin-top: 2px; letter-spacing: .02em; }
.proverb { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.proverb .hanzi { font-size: 20px; color: var(--ink); }
.proverb .pinyin { font-size: 13px; }
.proverb .ru { font-size: 13px; text-align: left; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.big-btn {
  position: relative; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 16px 12px 14px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); text-align: left;
  overflow: hidden; transition: transform .08s;
}
.big-btn .bi { font-family: var(--hanzi); font-size: 40px; font-weight: 400; color: var(--bordeaux); line-height: 1; margin-bottom: 8px; }
.big-btn small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.big-btn::after { content: ""; position: absolute; right: -18px; bottom: -18px; width: 64px; height: 64px; border-radius: 50%; border: 10px solid var(--gold); opacity: .14; }
.big-btn:active { transform: scale(.97); }

/* ── кнопки ── */
.btn {
  appearance: none; border: 0; border-radius: 13px; padding: 14px 18px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  user-select: none; transition: transform .08s, opacity .15s; line-height: 1.2;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-primary { background: linear-gradient(180deg, var(--bordeaux-2), var(--bordeaux)); color: #fff3e0; box-shadow: 0 2px 0 var(--gold), 0 8px 16px rgba(110, 27, 43, .3); }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line-2); }
.btn-danger { background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion)); color: #fff6ec; }
.btn-jade { background: linear-gradient(180deg, var(--jade-2), var(--jade)); color: #f3fff8; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
.btn-lg { padding: 17px 20px; font-size: 18px; }
.btns { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.btns.row2 { flex-direction: row; } .btns.row2 .btn { flex: 1; }

/* ── строки списков ── */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; font-size: 15px; }
.row:active { background: rgba(110, 27, 43, .06); }
.row-t { font-weight: 600; color: var(--ink); }
.row-s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.row-r { display: flex; align-items: center; gap: 8px; flex: none; }
.row-card { min-width: 0; }
.chev { color: var(--ink-3); font-size: 20px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; }
.badge.good { background: var(--ok-bg); color: var(--jade); } .badge.mid { background: var(--half-bg); color: #8a6a14; } .badge.bad { background: var(--bad-bg); color: var(--vermilion); }
:root[data-theme="dark"] .badge.mid { color: var(--gold-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.mid { color: var(--gold-2); } }

/* ── элементы форм ── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: all .12s; }
.chip small { font-weight: 400; color: var(--ink-3); margin-left: 2px; }
.chip.on { background: var(--gold); border-color: var(--gold); color: #2b1d18; } .chip.on small { color: #5c463c; }
.seg { display: flex; background: var(--paper-2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; color: var(--ink-2); font-size: 13.5px; font-weight: 600; transition: all .12s; white-space: nowrap; }
.seg button.on { background: var(--bordeaux); color: #fff3e0; box-shadow: 0 2px 6px rgba(110, 27, 43, .3); }
.top-seg { margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; margin-bottom: 5px; }
.field label .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
.inp { width: 100%; font-size: 17px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); outline: none; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(196, 154, 60, .25); }
.inp.ok { border-color: var(--jade); background: var(--ok-bg); } .inp.half { border-color: var(--gold); background: var(--half-bg); } .inp.bad { border-color: var(--vermilion); background: var(--bad-bg); }
textarea.inp { min-height: 160px; resize: vertical; font-size: 15px; line-height: 1.45; }
select.inp { appearance: none; -webkit-appearance: none; }
.search { margin: 10px 0 4px; font-size: 16px; }
.pv { font-family: var(--serif); font-style: italic; color: var(--bordeaux); font-size: 17px; min-height: 22px; margin-top: 5px; padding-left: 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle { width: 52px; height: 31px; border-radius: 16px; background: var(--paper-3); border: 0; position: relative; transition: background .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.toggle.on { background: var(--jade); } .toggle.on::after { transform: translateX(21px); }

/* ── иероглифы и карточка ── */
.hanzi { font-family: var(--hanzi); font-weight: 500; color: var(--ink); line-height: 1.15; }
.big-hanzi { font-size: 92px; text-align: center; letter-spacing: .02em; }
.big-hanzi.len3 { font-size: 72px; } .big-hanzi.len4 { font-size: 58px; } .big-hanzi.len5 { font-size: 44px; }
.hanzi.mid { font-size: 44px; text-align: center; } .hanzi.mid.len5 { font-size: 30px; }
.hanzi.sm { font-size: 20px; }
.pinyin { font-family: var(--serif); font-style: italic; color: var(--bordeaux); font-size: 24px; text-align: center; }
.pinyin.big { font-size: 38px; } .pinyin.sm { font-size: 15px; margin-left: 8px; }
.ru { color: var(--ink-2); font-size: 18px; text-align: center; line-height: 1.35; }
.ru.big { font-size: 26px; font-family: var(--serif); color: var(--ink); } .ru.sm { font-size: 13.5px; text-align: left; color: var(--ink-3); margin-top: 1px; }
.note { font-size: 13px; color: var(--ink-3); text-align: center; margin-top: 6px; font-style: italic; }

/* ── тест ── */
.qbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.progress { flex: 1; height: 7px; background: var(--paper-3); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bordeaux), var(--vermilion)); border-radius: 4px; transition: width .3s; }
.progress.gold > i { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.qcount { font-family: var(--serif); font-size: 15px; color: var(--ink-2); min-width: 44px; text-align: right; }
.qtimer { min-width: 36px; height: 36px; padding: 0 6px; border-radius: 18px; border: 2px solid var(--gold); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; color: var(--bordeaux); white-space: nowrap; font-size: 14px; }
.qtimer.urgent { border-color: var(--vermilion); color: var(--vermilion); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.qlabel { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); text-align: center; margin-bottom: 10px; font-weight: 700; }
.qcard { padding: 26px 16px 22px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; }
.opts { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
.opt {
  width: 100%; text-align: left; padding: 13px 14px; border-radius: 13px; background: var(--card); border: 1px solid var(--line-2); color: var(--ink); font-size: 16.5px; line-height: 1.3;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; transition: transform .08s; box-shadow: 0 2px 6px rgba(0,0,0,.05);
}
.opt:active { transform: scale(.985); }
.opt .opt-hanzi { font-family: var(--hanzi); font-size: 24px; }
.opt .opt-pinyin { font-family: var(--serif); font-style: italic; color: var(--bordeaux); }
.opt .opt-ru { color: var(--ink-2); font-size: 15px; }
.opt .opt-sep { color: var(--gold); }
.opt.correct { background: var(--ok-bg); border-color: var(--jade); box-shadow: 0 0 0 2px var(--jade) inset; }
.opt.wrong { background: var(--bad-bg); border-color: var(--vermilion); }
.opt:disabled { opacity: .85; }
.shake { animation: shake .45s; }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
.inputs { margin-top: 6px; }
.fb { margin-top: 14px; animation: fade .25s; }
.verdict { font-family: var(--serif); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.verdict.ok { color: var(--jade); } .verdict.half { color: var(--gold); } .verdict.bad { color: var(--vermilion); }
.fb-card { padding: 8px 0 12px; border-bottom: 1px dashed var(--line-2); margin-bottom: 10px; }
.fb-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.fb-p { color: var(--ink-3); min-width: 72px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.fb-a { flex: 1; font-weight: 600; } .fb-a.exact { color: var(--jade); } .fb-a.tones { color: var(--gold); } .fb-a.wrong { color: var(--vermilion); text-decoration: line-through; }
.fb-v { font-size: 12px; color: var(--ink-3); }
.fb .btn { margin-top: 10px; }

/* ── перевёртыш ── */
.flashcard { perspective: 1400px; height: 360px; margin: 4px 0 16px; cursor: pointer; }
.fc-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4, .15, .2, 1); }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border-radius: 20px; border: 1px solid var(--line);
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 18px; overflow: hidden;
}

/* ── результат ── */

.stamp {
  position: absolute; right: 14px; top: 10px; padding: 6px 10px; border: 3px solid currentColor; border-radius: 6px; font-family: var(--hanzi); font-size: 22px; font-weight: 700;
  transform: rotate(-12deg); opacity: .85; line-height: 1; text-align: center; mix-blend-mode: multiply;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: screen; } }
.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }

/* ── статистика ── */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

/* ── прочее ── */

@keyframes flashA { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

#modal.open { display: flex; }

@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }

#splash { position: fixed; inset: 0; z-index: 100; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s; }
#splash.hide { opacity: 0; pointer-events: none; }
.splash-t { font-family: var(--serif); font-size: 34px; font-weight: 700; color: var(--bordeaux); letter-spacing: .05em; }
.install-note { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.install-note b { color: var(--ink); }
kbd { font-family: var(--font); font-size: 12px; padding: 2px 6px; border-radius: 5px; background: var(--paper-2); border: 1px solid var(--line-2); }
@media (min-width: 600px) { .big-hanzi { font-size: 104px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── поход и профиль ── */
.avatar-btn { flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); background: var(--card); padding: 0; overflow: visible; box-shadow: 0 2px 8px rgba(0,0,0,.12); }

.dbar { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; height: 16px; }
.dbar i { display: block; border-radius: 3px; background: var(--paper-3); position: relative; }
.dbar i.rank { background: var(--gold-3); }

.dbar i.cur { box-shadow: inset 0 0 0 2px var(--gold); }
.dbar i.tick::before { content: ""; position: absolute; left: -2px; top: -4px; bottom: -4px; width: 1px; background: var(--ink-3); opacity: .5; }

.dots { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
.dots i, .legend i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--paper-3); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }

.rankup-t { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--vermilion); margin-bottom: 6px; }

.chest-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }

.r-common { --rc: var(--ink-3); } .r-uncommon { --rc: var(--jade); } .r-rare { --rc: #4a6b8a; } .r-epic { --rc: #8a3b7e; } .r-legendary { --rc: var(--gold); }
.inv-cell.r-uncommon, .inv-cell.r-rare, .inv-cell.r-epic, .inv-cell.r-legendary, .reveal-card { border-color: var(--rc); }

.rar-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; font-size: 11px; color: var(--ink-3); }

.ex-audio { text-align: center; padding: 8px 0; }

.ex-word { text-align: center; }
.ex-opt { font-size: 19px; }
.ex-pics.pool6 { grid-template-columns: repeat(3, 1fr); }
.ex-picbtn.used { opacity: .3; filter: grayscale(.8); }

/* Пиньинь: цифры тонов → диакритика, нормализация и сравнение. */
window.Pinyin = (() => {
  const VOWELS = {
    a: ['a', 'ā', 'á', 'ǎ', 'à'], e: ['e', 'ē', 'é', 'ě', 'è'], i: ['i', 'ī', 'í', 'ǐ', 'ì'],
    o: ['o', 'ō', 'ó', 'ǒ', 'ò'], u: ['u', 'ū', 'ú', 'ǔ', 'ù'], 'ü': ['ü', 'ǖ', 'ǘ', 'ǚ', 'ǜ'],
  };
  const MARK = {};
  for (const [base, arr] of Object.entries(VOWELS)) arr.forEach((ch, t) => {
    if (t) { MARK[ch] = [base, t]; MARK[ch.toUpperCase()] = [base, t]; }
  });

  function markSyllable(syl, tone) {
    if (tone < 1 || tone > 4) return syl;
    const low = syl.toLowerCase();
    let idx = -1;
    if (low.includes('a')) idx = low.indexOf('a');
    else if (low.includes('e')) idx = low.indexOf('e');
    else if (low.includes('ou')) idx = low.indexOf('o');
    else for (let i = low.length - 1; i >= 0; i--) if ('iouü'.includes(low[i])) { idx = i; break; }
    if (idx < 0) return syl;
    const ch = syl[idx], base = ch.toLowerCase();
    const arr = VOWELS[base];
    if (!arr) return syl;
    let m = arr[tone];
    if (ch !== base) m = m.toUpperCase();
    return syl.slice(0, idx) + m + syl.slice(idx + 1);
  }

  /* "ni3 hao3" → "nǐ hǎo"; "nv3"/"nu:3" → "nǚ"; уже размеченный текст не трогается */
  function toMarks(str) {
    return String(str || '').normalize('NFC')
      .replace(/u:/g, 'ü').replace(/U:/g, 'Ü')
      .replace(/v/g, 'ü').replace(/V/g, 'Ü')
      .replace(/([A-Za-zÜü]+)([0-5])/g, (m, s, t) => markSyllable(s, +t));
  }

  /* Разбор в сравнимую форму: буквы без тонов + последовательность тонов (1–4; нейтральный не учитывается) */
  function analyze(str) {
    const s = toMarks(str).normalize('NFC').toLowerCase();
    let letters = '';
    const tones = [];
    for (const ch of s) {
      if (MARK[ch]) { letters += MARK[ch][0]; tones.push(MARK[ch][1]); }
      else if (/[a-zü]/.test(ch)) letters += ch;
    }
    return { letters, tones };
  }

  /* 'exact' | 'tones' (буквы верны, тоны нет) | 'wrong' | 'empty' */
  function compare(expected, input) {
    const a = analyze(expected), b = analyze(input);
    if (!b.letters) return 'empty';
    if (a.letters !== b.letters) return 'wrong';
    return a.tones.join('') === b.tones.join('') ? 'exact' : 'tones';
  }

  function stripTones(str) {
    return toMarks(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').normalize('NFC');
  }
  function syllables(str) {
    return toMarks(str).split(/[\s'’\-…]+/).reduce((n, chunk) => {
      const m = analyze(chunk).letters.match(/[aeiouü]+/g);
      return n + (m ? m.length : 0);
    }, 0);
  }
  function initial(str) {
    const m = analyze(str).letters.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])/);
    return m ? m[1] : '';
  }
  function tonePattern(str) { return analyze(str).tones.join(''); }

  return { toMarks, analyze, compare, stripTones, syllables, initial, tonePattern };
})();

/* Хранилище: IndexedDB → localStorage → память (превью). Всё локально на устройстве. */
window.Store = (() => {
  const DB_NAME = 'zika', VER = 1, LS = 'zika:';
  let mode = 'mem', db = null;
  const mem = { kv: {}, attempts: {} };

  function openDB() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB_NAME, VER); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('attempts')) d.createObjectStore('attempts', { keyPath: 'id' });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error || new Error('idb error'));
      req.onblocked = () => rej(new Error('idb blocked'));
    });
  }
  function wrap(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  function lsOk() { try { localStorage.setItem(LS + 't', '1'); localStorage.removeItem(LS + 't'); return true; } catch (e) { return false; } }

  async function init() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      db = await Promise.race([openDB(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]);
      mode = 'idb';
    } catch (e) {
      mode = lsOk() ? 'ls' : 'mem';
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
    return mode;
  }

  async function get(key) {
    if (mode === 'idb') return wrap(db.transaction('kv').objectStore('kv').get(key));
    if (mode === 'ls') { const v = localStorage.getItem(LS + key); return v == null ? undefined : JSON.parse(v); }
    return mem.kv[key];
  }
  async function set(key, val) {
    if (mode === 'idb') return wrap(db.transaction('kv', 'readwrite').objectStore('kv').put(val, key));
    if (mode === 'ls') return localStorage.setItem(LS + key, JSON.stringify(val));
    mem.kv[key] = val;
  }
  function lsAttempts() { const v = localStorage.getItem(LS + 'attempts'); return v ? JSON.parse(v) : []; }
  function lsSaveAttempts(list) { localStorage.setItem(LS + 'attempts', JSON.stringify(list)); }

  async function allAttempts() {
    if (mode === 'idb') return wrap(db.transaction('attempts').objectStore('attempts').getAll());
    if (mode === 'ls') return lsAttempts();
    return Object.values(mem.attempts);
  }
  async function putAttempt(a) {
    if (mode === 'idb') return wrap(db.transaction('attempts', 'readwrite').objectStore('attempts').put(a));
    if (mode === 'ls') { const l = lsAttempts().filter(x => x.id !== a.id); l.push(a); return lsSaveAttempts(l); }
    mem.attempts[a.id] = a;
  }
  async function putAttempts(list) {
    if (mode === 'idb') {
      const tx = db.transaction('attempts', 'readwrite'), st = tx.objectStore('attempts');
      list.forEach(a => st.put(a));
      return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    }
    if (mode === 'ls') { const ids = new Set(list.map(a => a.id)); return lsSaveAttempts([...lsAttempts().filter(x => !ids.has(x.id)), ...list]); }
    list.forEach(a => { mem.attempts[a.id] = a; });
  }
  async function deleteAttempt(id) {
    if (mode === 'idb') return wrap(db.transaction('attempts', 'readwrite').objectStore('attempts').delete(id));
    if (mode === 'ls') return lsSaveAttempts(lsAttempts().filter(x => x.id !== id));
    delete mem.attempts[id];
  }
  async function clearAttempts() {
    if (mode === 'idb') return wrap(db.transaction('attempts', 'readwrite').objectStore('attempts').clear());
    if (mode === 'ls') return lsSaveAttempts([]);
    for (const k in mem.attempts) delete mem.attempts[k];
  }

  return { init, get, set, allAttempts, putAttempt, putAttempts, deleteAttempt, clearAttempts, get mode() { return mode; } };
})();

/* Звуки: синтез через Web Audio, без файлов. Клик, переворот, удача, неудача, финал. */
window.Sound = (() => {
  let ctx = null, enabled = true, unlocked = false, noiseBuf = null;

  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    return ctx;
  }
  function unlock() {
    const c = getCtx();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    if (!unlocked) {
      try {
        const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource();
        s.buffer = b; s.connect(c.destination); s.start(0);
      } catch (e) { /* ignore */ }
      unlocked = true;
    }
  }
  function env(g, t0, peak, attack, hold, release) {
    const p = g.gain;
    p.cancelScheduledValues(t0);
    p.setValueAtTime(0.0001, t0);
    p.linearRampToValueAtTime(peak, t0 + attack);
    p.setValueAtTime(peak, t0 + attack + hold);
    p.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + release);
  }
  function note({ freq, type = 'sine', at = 0, peak = 0.2, attack = 0.005, hold = 0.02, release = 0.15, sweepTo = null, detune = 0 }) {
    const c = getCtx();
    if (!c || !enabled) return;
    const t0 = c.currentTime + at, end = t0 + attack + hold + release;
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, end);
    o.detune.value = detune;
    const g = c.createGain();
    env(g, t0, peak, attack, hold, release);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(end + 0.05);
  }
  function noise({ at = 0, peak = 0.1, dur = 0.08, freq = 3000, type = 'bandpass', q = 1 }) {
    const c = getCtx();
    if (!c || !enabled) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + at;
    const s = c.createBufferSource(); s.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    env(g, t0, peak, 0.003, dur * 0.2, dur * 0.8);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }

  /* Короткий деревянный "ток" — кнопки */
  function click() {
    note({ freq: 1900, type: 'sine', peak: 0.07, hold: 0.004, release: 0.035 });
    noise({ peak: 0.035, dur: 0.03, freq: 4500, type: 'highpass' });
  }
  /* Шорох бумаги — переворот карточки */
  function flip() { noise({ peak: 0.07, dur: 0.2, freq: 1400, type: 'bandpass', q: 0.7 }); }
  /* Удача — щипок гучжэна, пентатоника вверх */
  function ok() {
    note({ freq: 659.25, type: 'triangle', peak: 0.17, release: 0.25 });
    note({ freq: 880, type: 'triangle', at: 0.09, peak: 0.17, release: 0.4 });
    note({ freq: 1760, type: 'sine', at: 0.09, peak: 0.045, release: 0.45 });
  }
  /* Неудача — глухой гонг вниз */
  function fail() {
    note({ freq: 220, type: 'triangle', peak: 0.2, hold: 0.05, release: 0.35, sweepTo: 140 });
    note({ freq: 110, type: 'sine', peak: 0.16, hold: 0.05, release: 0.45, sweepTo: 75 });
    noise({ peak: 0.05, dur: 0.12, freq: 380, type: 'lowpass' });
  }
  /* Финал теста: пройден — восходящая пентатоника, не пройден — нисходящая */
  function finish(good) {
    const seq = good ? [523.25, 587.33, 659.25, 783.99, 880, 1046.5] : [523.25, 493.88, 440, 392, 349.23];
    seq.forEach((f, i) => note({ freq: f, type: 'triangle', at: i * 0.09, peak: 0.15, release: 0.35 }));
    if (good) note({ freq: 2093, type: 'sine', at: seq.length * 0.09, peak: 0.05, release: 0.7 });
  }
  function setEnabled(v) { enabled = !!v; }
  function install() {
    const h = () => unlock();
    ['touchend', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, h, { passive: true }));
  }
  return { click, flip, ok, fail, finish, setEnabled, unlock, install, get enabled() { return enabled; } };
})();

/* Озвучка: китайский голос через speechSynthesis (работает офлайн со встроенными голосами iOS). */
window.Speech = (() => {
  const ok = typeof window !== 'undefined' && 'speechSynthesis' in window;
  if (ok) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
  function zhVoice() {
    if (!ok) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /zh[-_](CN|Hans)/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  }
  const available = () => ok && !!zhVoice();
  function say(text, rate = 0.8) {
    if (!ok) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = zhVoice();
      if (v) u.voice = v;
      u.lang = 'zh-CN'; u.rate = rate; u.pitch = 1;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  /* Проговорить и дождаться конца (для экзамена): resolve по onend, страховка по таймауту */
  function speak(text, rate = 0.78) {
    return new Promise(res => {
      if (!ok) return res(false);
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        const v = zhVoice();
        if (v) u.voice = v;
        u.lang = 'zh-CN'; u.rate = rate;
        let done = false;
        const fin = () => { if (!done) { done = true; res(true); } };
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 1500 + String(text).length * 450);
        speechSynthesis.speak(u);
      } catch (e) { res(false); }
    });
  }
  return { say, speak, available, zhVoice };

window.Stats = (() => {
  const pad = n => String(n).padStart(2, '0');
  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  /* Карточки: сколько раз спрашивали, верно, частично, последняя, серия верных подряд */
  function cardStats(attempts) {
    const m = {};
    const sorted = attempts.slice().sort((a, b) => a.ts - b.ts);
    for (const a of sorted) for (const q of a.questions || []) {
      const s = m[q.cardId] || (m[q.cardId] = { asked: 0, correct: 0, partial: 0, wrong: 0, lastAt: 0, lastOk: null, streak: 0, timeMs: 0 });
      s.asked++;

      const d = new Date(k + 'T00:00:00');

    if (!set.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
    while (set.has(dayKey(d.getTime()))) { cur++; d.setDate(d.getDate() - 1); }
    return { current: cur, best, days: days.length };
  }

    const n = attempts.length;
    const sum = f => attempts.reduce((a, x) => a + (f(x) || 0), 0);
    const st = streaks(attempts);
    const questions = sum(a => a.total), timeMs = sum(a => a.durationMs);
    return {
      attempts: n,
      avgPercent: n ? Math.round(sum(a => a.percent) / n) : 0,
      avgScore: n ? Math.round(sum(a => a.score) / n) : 0,
      best: n ? Math.max(...attempts.map(a => a.percent)) : 0,
      worst: n ? Math.min(...attempts.map(a => a.percent)) : 0,
      questions, correct: sum(a => a.correct), timeMs,

    const out = [], now = new Date();
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);

  function rollRarity(rnd = Math.random) {
    const total = ORDER.reduce((s, k) => s + RARITY[k].w, 0);
    let x = rnd() * total;
    for (const k of ORDER) { x -= RARITY[k].w; if (x <= 0) return k; }
    return 'common';
  }
  function rollItem(rnd = Math.random) {
    const r = rollRarity(rnd), pool = ITEMS.filter(i => i.rarity === r);

  /* Открыть сундук: 3 предмета, первый — не ниже «необычного» */
  function openChest(rnd = Math.random) {

  return { RARITY, ORDER, ITEMS, byId, PER_CHEST, rollRarity, rollItem, openChest, value, count, fmtValue };
})();

/* Поход: очки за день, переход (кап), марш-бросок 兼程 (5× кап = день за два), пропуск = откат на день.
   30 дней похода, 10 рангов — ранг каждые 3 зачтённых дня. Состояние хранится как контрольная точка
   (days + processedThrough) и продвигается только вперёд по календарю; очки каждой попытки зафиксированы в ней самой. */
window.Campaign = (() => {
  const CAP = 400, ULTRA_MULT = 5, ULTRA = CAP * ULTRA_MULT, TOTAL_DAYS = 30, RANKS = 10, DAYS_PER_RANK = TOTAL_DAYS / RANKS;
  const BASE = { quiz: { easy: 2, medium: 4, hard: 8 }, write: { easy: 5, medium: 7, hard: 10 }, listen: { easy: 3, medium: 5, hard: 9 }, sentence: { easy: 4, medium: 7, hard: 12 }, flip: 1, hsk: 4 };
  const BONUS = { finish: 5, perfect: 10, pass: 30 };
  const NAMES = { cap: 'Переход', ultra: 'Марш-бросок', ultraZh: '兼程' };

  function questionPoints(a, q) {
    let base;
    if (a.mode === 'flip') base = BASE.flip;
    else if (a.mode === 'hsk') base = BASE.hsk;
    else if (BASE[a.mode] && typeof BASE[a.mode] === 'object') base = BASE[a.mode][a.difficulty] || 3;
    else base = BASE.quiz[a.difficulty] || 2;
    return base * (q.fraction || 0);
  }
  function attemptPoints(a) {
    let p = 0;
    for (const q of a.questions || []) p += questionPoints(a, q);
    if (!a.aborted && a.total >= 10) p += BONUS.finish;
    if (a.percent === 100 && a.total >= 10) p += BONUS.perfect;
    if (a.mode === 'hsk' && a.passed) p += BONUS.pass;
    return Math.round(p * 10) / 10;
  }
  const pts = a => (a.points != null ? a.points : attemptPoints(a));

  const key = ts => Stats.dayKey(ts);
  function addDays(k, n) { const [y, m, d] = k.split('-').map(Number); return key(new Date(y, m - 1, d + n, 12).getTime()); }
  function dayPoints(attempts, k) { let p = 0; for (const a of attempts) if (key(a.ts) === k) p += pts(a); return Math.round(p * 10) / 10; }
  const dayResult = p => (p >= ULTRA ? 'ultra' : p >= CAP ? 'done' : 'miss');

  function create() { return { schema: 1, days: 0, startedAt: null, processedThrough: null, log: [], rankPeak: 0, stats: { done: 0, ultra: 0, miss: 0 } }; }

  /* Финализирует все прошедшие календарные дни. Возвращает новые записи журнала. Сегодняшний день не трогает. */
  function process(c, attempts, now = Date.now()) {
    const today = key(now), added = [];
    if (!c.stats) c.stats = { done: 0, ultra: 0, miss: 0 };
    if (!c.log) c.log = [];
    if (!c.startedAt) {
      if (!attempts.length) return added;
      c.startedAt = key(Math.min(...attempts.map(a => a.ts)));
      c.processedThrough = addDays(c.startedAt, -1);
    }
    if (!c.processedThrough || c.processedThrough >= today) { c.rankPeak = Math.max(c.rankPeak || 0, rankIndex(effectiveDays(c, attempts, now))); return added; }
    let k = addDays(c.processedThrough, 1), guard = 0;
    while (k < today && guard++ < 5000) {
      const p = dayPoints(attempts, k), r = dayResult(p);
      if (r === 'ultra') c.days += 2; else if (r === 'done') c.days += 1; else c.days = Math.max(0, c.days - 1);
      c.stats[r] = (c.stats[r] || 0) + 1;
      const e = { d: k, p, r };
      c.log.push(e); added.push(e);
      c.processedThrough = k;
      k = addDays(k, 1);
    }
    if (c.log.length > 400) c.log = c.log.slice(-400);
    c.rankPeak = Math.max(c.rankPeak || 0, rankIndex(effectiveDays(c, attempts, now)));
    return added;
  }
  function todayState(c, attempts, now = Date.now()) {
    const k = key(now), p = dayPoints(attempts, k);
    return { key: k, points: p, done: p >= CAP, ultra: p >= ULTRA, bonus: p >= ULTRA ? 2 : p >= CAP ? 1 : 0, toCap: Math.max(0, CAP - p), toUltra: Math.max(0, ULTRA - p) };
  }
  const effectiveDays = (c, attempts, now) => ((c && c.days) || 0) + todayState(c, attempts, now).bonus;
  const rankIndex = days => Math.min(RANKS - 1, Math.floor(Math.max(0, days) / DAYS_PER_RANK));
  function rankProgress(days) {
    days = Math.max(0, days);
    if (days >= TOTAL_DAYS) return { idx: RANKS - 1, inRank: DAYS_PER_RANK, need: DAYS_PER_RANK, complete: true, extra: days - TOTAL_DAYS, toNext: 0 };
    const idx = rankIndex(days);
    return { idx, inRank: days - idx * DAYS_PER_RANK, need: DAYS_PER_RANK, complete: false, extra: 0, toNext: (idx + 1) * DAYS_PER_RANK - days };
  }
  /* Последние n календарных дней: r = 'done' | 'ultra' | 'miss' | 'today' | 'none' */
  function recent(c, attempts, n = 30, now = Date.now()) {
    const today = key(now), byDay = {};
    for (const e of (c && c.log) || []) byDay[e.d] = e;
    const out = [];
    for (let i = n - 1; i >= 1; i--) { const k = addDays(today, -i); const e = byDay[k]; out.push(e ? { d: k, r: e.r, p: e.p } : { d: k, r: c && c.startedAt && k >= c.startedAt ? 'miss' : 'none', p: 0 }); }
    const t = todayState(c, attempts, now);
    out.push({ d: today, r: 'today', p: t.points, done: t.done, ultra: t.ultra });
    return out;
  }
  /* ── сундуки за марш-броски ── */
  function ensureChests(c) { if (!c.chests) c.chests = { pending: 0, opened: 0, granted: [] }; if (!c.inventory) c.inventory = {}; if (!c.chestLog) c.chestLog = []; return c; }
  /* По одному сундуку за каждый день-марш-бросок (прошедший или сегодняшний). Возвращает число новых. */
  function grantChests(c, attempts, now = Date.now()) {
    ensureChests(c); let n = 0;
    const grant = d => { if (!c.chests.granted.includes(d)) { c.chests.granted.push(d); c.chests.pending++; n++; } };
    for (const e of c.log || []) if (e.r === 'ultra') grant(e.d);
    const t = todayState(c, attempts, now); if (t.ultra) grant(t.key);
    if (c.chests.granted.length > 500) c.chests.granted = c.chests.granted.slice(-500);
    return n;
  }
  function openChest(c, rnd) {
    ensureChests(c);
    if (c.chests.pending <= 0) return null;
    const items = Treasures.openChest(rnd);
    c.chests.pending--; c.chests.opened++;
    for (const id of items) c.inventory[id] = (c.inventory[id] || 0) + 1;
    const entry = { ts: Date.now(), items, value: items.reduce((s, id) => s + (Treasures.byId[id] ? Treasures.byId[id].value : 0), 0) };
    c.chestLog.push(entry); if (c.chestLog.length > 200) c.chestLog = c.chestLog.slice(-200);
    return entry;
  }
  return { ensureChests, grantChests, openChest, CAP, ULTRA, ULTRA_MULT, TOTAL_DAYS, RANKS, DAYS_PER_RANK, BASE, BONUS, NAMES, attemptPoints, questionPoints, dayPoints, addDays, create, process, todayState, effectiveDays, rankIndex, rankProgress, recent };
})();

/* Наставник Лун 龙教头: напоминания с полудня, настроение зависит от времени и недобранных очков. */
window.Dragon = (() => {
  const MOODS = [
    { img: 'dragon-1', title: 'Наставник Лун ждёт с добром' },
    { img: 'dragon-2', title: 'Наставник Лун волнуется' },

    { img: 'dragon-4', title: 'Наставник Лун теряет терпение' },
  ];
  const PHRASES = [
    ['Полдень миновал. {n} очков до перехода — начнём, пока солнце высоко?',
     'Лун потягивается на черепице: «Небольшая тренировка — и день зачтён».',
     'Свиток дня ещё пуст. {n} очков — это минут двадцать, не больше.',

     'Хороший воин тренируется до заката. Осталось {n}.',
     'Лун подмигивает: «Сундук сам себя не заработает».'],
    ['Лун поглядывает на солнце: до перехода ещё {n}. День короче, чем кажется.',
     'Лун грызёт кончик кисти: «{n} очков… успеем?»',
     'Полдня прошло, а свиток дня почти пуст: {n} до перехода.',
     'Лун ходит кругами по крыше: «Не откладывай на вечер двадцать минут дела».',
     'Ещё {n} очков — иначе вечером будет неловко. Мне. За тебя.',
     'Лун вздыхает: «Карточки скучают. И я скучаю».'],
    ['Лун постукивает когтем по черепице: {n} очков. Я жду.',
     'Дым из ноздрей: «Солнце садится, а перехода нет. {n}!»',
     'Лун свернулся у двери и не уйдёт, пока не увидит {n} очков.',
     '«Поход не прощает пустых дней», — Лун смотрит не мигая. {n} до перехода.',
     'Лун точит когти: «Двадцать минут. Всего двадцать минут. {n} очков».',
     'Хвост Луна хлещет по черепице: до перехода {n}.'],
    ['В темноте светятся глаза Луна: «{n} очков — или на рассвете поход откатится. Я приду посмотреть».',
     '«Дракон помнит все пропущенные дни», — шепчет Лун из тени. {n} до перехода.',
     'Гром над крышей. Это не гроза — это Лун. {n} очков до перехода.',
     'Лун уже не просит. Лун ждёт {n} очков. Молча. В темноте.',
     '«Завтра ранг может пасть. Решай сейчас». Чешуя Луна блестит в лунном свете. {n}!',
     'Последние часы дня. {n} очков между тобой и откатом. Лун наблюдает.'],
  ];
  /* 0..1 — насколько пора волноваться; -1 — дракон молчит (утро или день зачтён) */
  function urgency(t, now = new Date()) {
    if (!t || t.done) return -1;
    const h = now.getHours() + now.getMinutes() / 60;
    if (h < 12) return -1;
    const timeF = Math.min(1, (h - 12) / 10);
    const remF = Math.min(1, t.toCap / Campaign.CAP);
    return Math.min(1, timeF * 0.65 + remF * 0.35);
  }
  const moodIdx = u => (u < 0 ? -1 : u < 0.33 ? 0 : u < 0.52 ? 1 : u < 0.74 ? 2 : 3);
  function phrase(m, t, now = new Date()) {
    const list = PHRASES[Math.max(0, Math.min(3, m))];
    const seed = now.getDate() * 7 + now.getHours();
    return list[seed % list.length].replace('{n}', String(Math.round(t.toCap)));
  }
  /* null — молчит; иначе { mood, img, title, text, t } */
  function state(campaign, attempts, now = new Date()) {
    if (typeof window.__dragonForce === 'number') {
      const t = Campaign.todayState(campaign, attempts);
      const m = Math.max(0, Math.min(3, window.__dragonForce));
      return { mood: m, img: MOODS[m].img, title: MOODS[m].title, text: phrase(m, { toCap: t.toCap || 400 }, now), t };
    }

  }
  return { MOODS, PHRASES, urgency, moodIdx, phrase, state };
})();

      for (const c of ctx.cards) if (c.from && map[c.from]) c.from = map[c.from];

      return `<div class="vh"><div class="seal">练</div><div class="grow"><h1 class="title">Тренировка</h1><div class="sub">У каждого режима — свои настройки</div></div></div>
      <div class="panel"><div class="flabel">Режим</div><div class="chips">${MODES.map(x => chip(x === m, MODE_TITLES[x], 'setup-mode', x)).join('')}</div><div class="hint">${MODE_HINTS[m]}</div>
        ${m === 'write' ? '<button class="btn btn-secondary btn-sm btn-block mt" data-action="kbd-tip">Как включить китайскую клавиатуру</button>' : ''}
        ${m === 'listen' && !Speech.available() ? '<div class="warn mt">Китайский голос не найден. iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → Китайский, затем перезапустите приложение.</div>' : ''}
        ${m === 'sentence' ? `<div class="hint">В банке ${Sentences.ITEMS.length} фраз — вопросы с однозначным ответом.</div>` : ''}</div>
      ${hasDecks ? `<div class="panel"><div class="flabel">Колоды <span class="muted">· карточек: ${n}</span></div><div class="chips">${allDecks().map(d => chip(c.deckIds.includes(d.id), esc(d.name) + ` <small>${cardsOfDeck(d.id).length}</small>`, 'setup-deck', d.id)).join('')}</div></div>` : ''}
      ${isQuiz ? `<div class="panel"><div class="flabel">Показывать</div>${seg(c, 'show', [['hanzi', 'Иероглиф'], ['pinyin', 'Пиньинь'], ['ru', 'Перевод'], ['mixed', 'Смешанно']])}
        ${c.show !== 'mixed' ? `<div class="flabel mt">Угадывать</div><div class="chips">${Quiz.PARTS.filter(p => p !== c.show).map(p => chip(c.guess.includes(p), LABELS.part[p], 'setup-guess', p)).join('')}</div>` : '<div class="hint">Направление меняется от вопроса к вопросу.</div>'}</div>` : ''}
      ${m === 'flip' ? `<div class="panel"><div class="flabel">Показывать сначала</div>${seg(c, 'show', [['hanzi', 'Иероглиф'], ['pinyin', 'Пиньинь'], ['ru', 'Перевод']])}</div>` : ''}
      ${hasDiff ? `<div class="panel"><div class="flabel">Сложность</div>${seg(c, 'difficulty', [['easy', 'Лёгкий'], ['medium', 'Средний'], ['hard', 'Сложный']])}<div class="hint">${diffHint} ${pointsLine(m, c.difficulty)}</div></div>` : ''}
      <div class="panel"><div class="flabel">Сколько за подход</div>${seg(c, 'count', counts)}
        <div class="flabel mt">Порядок</div>${seg(c, 'order', [['random', 'Случайно'], ['weak', 'Сначала слабые'], ['new', 'Сначала новые']])}
        ${m !== 'flip' ? `<div class="flabel mt">Таймер на вопрос</div>${seg(c, 'timer', [[0, 'Нет'], [10, '10 с'], [20, '20 с'], [30, '30 с']])}` : ''}</div>
      <button class="btn btn-primary btn-block btn-lg" data-action="setup-start" ${n < 1 ? 'disabled' : ''}>Начать${n ? ' · ' + fmt.plural(planned, m === 'sentence' ? 'фраза' : 'карточка', m === 'sentence' ? 'фразы' : 'карточки', m === 'sentence' ? 'фраз' : 'карточек') : ''}</button>
      <div class="hint" style="text-align:center">Экзамены HSK эти настройки не трогают — у них фиксированный формат.</div>`;
    },
  };
  actions['setup-mode'] = el => { getSetup().mode = el.dataset.arg; saveSetup(); render(); };
  actions['setup-deck'] = el => { const c = cur(), id = el.dataset.arg; if (!c.deckIds) return; if (c.deckIds.includes(id)) { if (c.deckIds.length > 1) c.deckIds = c.deckIds.filter(x => x !== id); } else c.deckIds.push(id); saveSetup(); render(); };
  actions['setup-guess'] = el => { const c = cur(), p = el.dataset.arg; if (!c.guess) return; if (c.guess.includes(p)) { if (c.guess.length > 1) c.guess = c.guess.filter(x => x !== p); } else c.guess.push(p); saveSetup(); render(); };
  actions['setup-set'] = el => {
    const c = cur(), k = el.dataset.key;
    let v = el.dataset.val;
    if ((k === 'count' && v !== 'all') || k === 'timer') v = +v;
    c[k] = v;
    if (k === 'show' && getSetup().mode === 'quiz' && v !== 'mixed') { c.guess = (c.guess || []).filter(p => p !== v); if (!c.guess.length) c.guess = Quiz.PARTS.filter(p => p !== v); }
    saveSetup(); render();
  };
  actions['setup-start'] = () => { const s = getSetup(); startSession(s.mode, JSON.parse(JSON.stringify(s.byMode[s.mode]))); };
  actions['learn-deck'] = el => { const s = getSetup(); if (!s.byMode[s.mode].deckIds) s.mode = 'quiz'; s.byMode[s.mode].deckIds = [el.dataset.id]; saveSetup(); closeSheet(); nav('setup'); };
  actions['kbd-tip'] = () => {
    sheet(`<h3 class="sh-t">Китайская клавиатура на iPhone</h3>
    <div class="install-note">
      <p><b>1.</b> Настройки → Основные → Клавиатура → Клавиатуры → <b>Новые клавиатуры…</b></p>
      <p><b>2.</b> Выберите <b>Китайский (упрощённый)</b> → <b>Пиньинь — QWERTY</b>. Там же можно добавить <b>Рукописный ввод</b> — рисовать иероглиф пальцем.</p>
      <p><b>3.</b> В поле ввода нажмите <kbd>🌐</kbd> на клавиатуре и выберите <b>简体拼音</b>. Набираете латиницей <kbd>nihao</kbd> — сверху появляются иероглифы, выбираете <b>你好</b>.</p>
      <p>В рукописном режиме (<b>简体手写</b>) — рисуете иероглиф в поле, выбираете распознанный вариант.</p>
    </div>
    <button class="btn btn-primary btn-block mt" data-close>Понятно</button>`);
  };

  /* ── запуск ── */
  function startSession(mode, cfg, extra = {}) {
    cfg = cfg || {};
    cfg.mode = mode;
    if (mode === 'listen') { cfg.show = 'audio'; cfg.guess = ['answer']; }
    if (mode === 'sentence') { cfg.show = 'sentence'; cfg.guess = ['answer']; }
    if (mode === 'write') { cfg.guess = ['hanzi']; if (!cfg.show) cfg.show = 'write'; }
    if (mode === 'quiz') { if (!cfg.show) cfg.show = 'mixed'; if (!cfg.guess) cfg.guess = []; }
    let questions;
    if (mode === 'sentence') {
      questions = Quiz.buildSentence(extra.items || Sentences.ITEMS, cfg, state.cardStats);
      if (!questions.length) return toast('Нет фраз для тренировки');
    } else {
      const cards = extra.cards || cardsOfDecks(cfg.deckIds || []);
      if (!cards.length) return toast('Нет карточек для тренировки');
      if (mode === 'listen') {
        if (!Speech.available()) return toast('Нет китайского голоса — включите его в настройках iPhone и перезапустите', 4000);
        questions = Quiz.buildListen(cards, cfg, state.cardStats);
      } else {
        const pool = cards.length >= 12 ? cards : [...cards, ...hskCards];
        questions = Quiz.buildQuestions(cards, pool, cfg, state.cardStats);
      }
    }
    quiz = { cfg, kind: extra.kind || mode, level: extra.level || null, deckIds: (cfg.deckIds || []).slice(), questions, i: 0, startedAt: Date.now(), qStart: Date.now(), answered: false, flipped: false, timerId: null, timeLeft: 0 };
    nav('quiz');
  }

  /* ── экран вопроса ── */
  views.quiz = {
    render() {
      if (!quiz) return '<div class="empty">Нет активной тренировки.</div><div class="btns"><button class="btn btn-primary btn-block" data-go="setup" data-replace>К настройке</button></div>';
      const q = quiz.questions[quiz.i], total = quiz.questions.length, card = q.card, isFlip = quiz.cfg.mode === 'flip';
      const head = `<div class="qbar"><button class="icon-btn" data-action="quiz-quit" aria-label="Выйти">✕</button><div class="progress"><i style="width:${quiz.i / total * 100}%"></i></div><div class="qcount">${quiz.i + 1}/${total}</div>${quiz.cfg.timer && !isFlip ? `<div class="qtimer" id="qtimer">${quiz.cfg.timer}</div>` : ''}</div>`;
      if (isFlip) return head + renderFlip(q);
      let promptBody;
      if (q.show === 'audio') promptBody = `<button class="say-btn" data-action="say" data-nosound aria-label="Прослушать">🔊</button><div class="hint" style="text-align:center;margin-top:10px">Нажмите, чтобы прослушать ещё раз</div>`;
      else if (q.show === 'sentence') promptBody = `<div class="hanzi sent-q">${esc(q.sent.q)}</div>${quiz.cfg.difficulty === 'easy' ? `<div class="pinyin" style="font-size:16px">${esc(q.sent.py)}</div><div class="ru" style="font-size:15px">${esc(q.sent.ru)}</div>` : ''}`;
      else if (q.show === 'both') promptBody = renderPart(card, 'pinyin', 'big') + renderPart(card, 'ru', '');
      else if (q.show === 'hp') promptBody = renderPart(card, 'hanzi', 'big') + renderPart(card, 'pinyin', '');
      else promptBody = renderPart(card, q.show, 'big');
      const dirLabel = `${LABELS.part[q.show] || ''} → ${q.guess.map(p => LABELS.part[p] || p).join(' + ')}`;
      const prompt = `<div class="panel ornate qcard"><div class="qlabel">${dirLabel}</div>${promptBody}</div>`;
      let answer;
      if (q.options) {
        answer = `<div class="opts" id="opts">${q.options.map((o, i) => `<button class="opt ${o.text != null ? 'opt-txt' : ''}" data-action="answer" data-idx="${i}" data-nosound>${o.text != null ? `<span class="opt-hanzi">${esc(o.text)}</span>` : (q.optionParts || q.guess).map(p => `<span class="opt-${p}">${esc(o[p])}</span>`).join('<span class="opt-sep">·</span>')}</button>`).join('')}</div>`;
      } else {
        const fields = q.kind === 'listen' ? [['answer', 'Ответ <span class="muted">· иероглифы или пиньинь с тонами</span>', '汉字 / pinyin']]
          : q.kind === 'sentence' ? [['answer', 'Ответ иероглифами <span class="muted">· клавиатура 中文 через 🌐</span>', '汉字']]
          : q.guess.map(p => [p, LABELS.part[p] + (p === 'pinyin' ? ' <span class="muted">· тоны цифрами, ü = v</span>' : p === 'hanzi' ? ' <span class="muted">· клавиатура 中文 через 🌐</span>' : ''), p === 'pinyin' ? 'ni3 hao3' : p === 'ru' ? 'перевод' : '汉字']);
        answer = `<form id="inputs" class="inputs" autocomplete="off">${fields.map(([nm, lbl, ph]) => `<div class="field"><label>${lbl}</label><input class="inp" name="${nm}" lang="zh-CN" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${ph}">${nm === 'pinyin' ? '<div class="pv" id="pv"></div>' : ''}</div>`).join('')}<button class="btn btn-primary btn-block" type="submit">Проверить</button></form>`;
      }
      return head + prompt + answer + '<div id="feedback"></div>';
    },
    mount() {
      if (!quiz) return;
      startTimer();
      const q = quiz.questions[quiz.i];
      if (q && q.show === 'audio' && !quiz.answered) setTimeout(() => Speech.say(q.card.hanzi), 250);
      const f = $('#inputs');
      if (f) {
        f.addEventListener('submit', e => { e.preventDefault(); submitInput(); });
        const pin = f.querySelector('input[name=pinyin]');
        if (pin) pin.addEventListener('input', () => { $('#pv').textContent = Pinyin.toMarks(pin.value); });
        const first = f.querySelector('input');
        if (first && q.show !== 'audio') setTimeout(() => first.focus(), 80);
      }
    },
  };
  actions.say = () => { const q = quiz && quiz.questions[quiz.i]; if (q && q.card) { Sound.click(); Speech.say(q.card.hanzi); } };

  function renderFlip(q) {
    const c = q.card;
    const back = `<div class="hanzi mid ${c.hanzi.replace(/[…\s]/g, '').length >= 5 ? 'len5' : ''}">${esc(c.hanzi)}</div><div class="pinyin">${esc(c.pinyin)}</div><div class="ru">${esc(c.ru)}</div>${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}`;
    return `<div class="flashcard ${quiz.flipped ? 'flipped' : ''}" id="fc" data-action="flip" data-nosound><div class="fc-inner"><div class="fc-face fc-front"><div class="qlabel">${LABELS.part[q.show]}</div>${renderPart(c, q.show, 'big')}<div class="fc-hint">нажмите, чтобы перевернуть</div></div><div class="fc-face fc-back">${back}</div></div></div>
    <div class="flip-btns ${quiz.flipped ? '' : 'hidden'}" id="flipbtns"><button class="btn btn-danger" data-action="flip-answer" data-ok="0" data-nosound>Не знал</button><button class="btn btn-jade" data-action="flip-answer" data-ok="1" data-nosound>Знал</button></div>`;
  }
  actions.flip = () => { if (!quiz || quiz.flipped) return; quiz.flipped = true; Sound.flip(); $('#fc').classList.add('flipped'); $('#flipbtns').classList.remove('hidden'); };
  actions['flip-answer'] = el => {
    if (!quiz || !quiz.flipped || quiz.answered) return;
    const ok = el.dataset.ok === '1', q = quiz.questions[quiz.i], parts = {};
    q.guess.forEach(p => { parts[p] = ok ? 'exact' : 'wrong'; });
    q.result = { parts, fraction: ok ? 1 : 0, ok }; q.answer = { self: ok }; q.ms = Date.now() - quiz.qStart; quiz.answered = true;
    if (ok) { Sound.ok(); flash('ok'); } else { Sound.fail(); flash('bad'); }
    setTimeout(next, 220);
  };
  actions.answer = el => {
    if (!quiz || quiz.answered) return;
    const q = quiz.questions[quiz.i], idx = +el.dataset.idx;
    const txt = q.options[idx] ? (q.options[idx].text != null ? q.options[idx].text : q.guess.map(p => q.options[idx][p]).join(' · ')) : '';
    finishQuestion(q, Quiz.checkChoice(q, idx), { choice: idx, choiceText: txt });
  };
  function submitInput(timeout) {
    if (!quiz || quiz.answered) return;
    const q = quiz.questions[quiz.i], f = $('#inputs'), answers = {};
    const names = q.kind === 'listen' || q.kind === 'sentence' ? ['answer'] : q.guess;
    names.forEach(nm => { answers[nm] = f && f.elements[nm] ? f.elements[nm].value : ''; });
    if (!timeout && !Object.values(answers).some(v => v.trim())) { toast('Введите ответ'); return; }
    const res = q.kind === 'listen' ? Quiz.checkListen(q, answers.answer) : q.kind === 'sentence' ? Quiz.checkSentence(q, answers.answer) : Quiz.checkInput(q, answers);
    finishQuestion(q, res, { input: answers, timeout: !!timeout });
  }
  function finishQuestion(q, result, answer) {
    stopTimer(); quiz.answered = true;
    const tm = $('#qtimer'); if (tm) tm.classList.add('hidden');
    if (q.show === 'audio') { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    q.result = result; q.answer = answer; q.ms = Date.now() - quiz.qStart;
    if (result.ok) { Sound.ok(); flash('ok'); } else { Sound.fail(); flash('bad'); }
    const opts = $('#opts');
    if (opts) Array.from(opts.children).forEach((b, i) => { b.disabled = true; if (i === q.answerIdx) b.classList.add('correct'); else if (answer.choice === i) b.classList.add('wrong', 'shake'); });
    const f = $('#inputs');
    if (f) { f.querySelectorAll('input').forEach(inp => { inp.disabled = true; inp.blur(); const r = result.parts[inp.name]; inp.classList.add(r === 'exact' ? 'ok' : r === 'tones' ? 'half' : 'bad'); }); const sb = f.querySelector('button[type=submit]'); if (sb) sb.style.display = 'none'; }
    const fb = $('#feedback'); fb.innerHTML = feedbackHtml(q, result, answer);
    setTimeout(() => fb.scrollIntoView({ behavior: 'smooth', block: 'end' }), 60);
  }
  function feedbackHtml(q, result, answer) {
    const c = q.card, last = quiz.i === quiz.questions.length - 1;
    const verdict = result.ok ? '<div class="verdict ok">Верно · 对</div>' : result.fraction > 0 ? '<div class="verdict half">Частично</div>' : `<div class="verdict bad">${answer.timeout ? 'Время вышло' : 'Неверно · 错'}</div>`;
    const nextBtn = `<button class="btn btn-primary btn-block" data-action="quiz-next">${last ? 'Результат' : 'Дальше'}</button>`;
    const givenRows = result.ok ? '' : (q.guess || []).map(p => {
      const r = result.parts[p];
      if (!r) return '';
      const lbl = r === 'exact' ? 'верно' : r === 'tones' ? 'буквы верны, тоны нет' : 'неверно';
      let given = answer.input ? answer.input[p] : (answer.choice >= 0 && q.options && q.options[answer.choice] ? (q.options[answer.choice].text != null ? q.options[answer.choice].text : (q.options[answer.choice][p] != null ? q.options[answer.choice][p] : answer.choiceText)) : '');
      if (p === 'pinyin' && given) given = Pinyin.toMarks(given);
      return `<div class="fb-row"><span class="fb-p">${LABELS.part[p] || p}</span><span class="fb-a ${r}">${esc(given) || '—'}</span><span class="fb-v">${lbl}</span></div>`;
    }).join('');
    if (q.kind === 'sentence') {
      const it = q.sent;
      return `<div class="panel fb">${verdict}<div class="fb-card"><div class="hint" style="margin:0 0 6px">${esc(it.q)}</div><div class="hanzi mid">${esc(it.a[0])}</div><div class="pinyin" style="font-size:15px">${esc(it.py)}</div><div class="ru">${esc(it.ru)}</div>${it.a.length > 1 ? `<div class="note">Также верно: ${it.a.slice(1).map(esc).join('、')}</div>` : ''}</div>${givenRows}${nextBtn}</div>`;
    }
    return `<div class="panel fb">${verdict}<div class="fb-card"><div class="hanzi mid ${c.hanzi.replace(/[…\s]/g, '').length >= 5 ? 'len5' : ''}">${esc(c.hanzi)}</div><div class="pinyin">${esc(c.pinyin)}</div><div class="ru">${esc(c.ru)}</div>${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div>${givenRows}${nextBtn}</div>`;
  }
  function next() {
    if (!quiz || !quiz.answered) return;
    if (quiz.i >= quiz.questions.length - 1) return finishQuiz(false);
    quiz.i++; quiz.answered = false; quiz.flipped = false; quiz.qStart = Date.now(); render();
  }
  actions['quiz-next'] = next;
  function startTimer() {
    stopTimer();
    if (!quiz || !quiz.cfg.timer || quiz.cfg.mode === 'flip' || quiz.answered) return;
    quiz.timeLeft = quiz.cfg.timer;
    const el = $('#qtimer');
    quiz.timerId = setInterval(() => {
      quiz.timeLeft--;
      if (el) { el.textContent = quiz.timeLeft; el.classList.toggle('urgent', quiz.timeLeft <= 3); }
      if (quiz.timeLeft <= 0) { stopTimer(); const q = quiz.questions[quiz.i]; if (q.options) finishQuestion(q, Quiz.checkChoice(q, -1), { choice: -1, timeout: true }); else submitInput(true); }
    }, 1000);
  }
  function stopTimer() { if (quiz && quiz.timerId) { clearInterval(quiz.timerId); quiz.timerId = null; } }
  actions['quiz-quit'] = () => {
    if (!quiz) return;
    const done = quiz.questions.filter(q => q.result).length;
    stopTimer();
    sheet(`<h3 class="sh-t">Выйти из тренировки?</h3><p style="color:var(--ink-2);margin:0 0 14px">Отвечено ${done} из ${quiz.questions.length}.</p><div class="btns mt0">${done ? '<button class="btn btn-primary btn-block" id="qs">Сохранить ответы и выйти</button>' : ''}<button class="btn btn-danger btn-block" id="qd">Выйти без сохранения</button><button class="btn btn-secondary btn-block" id="qc">Продолжить</button></div>`, s => {
      const qs = $('#qs', s); if (qs) qs.onclick = () => { closeSheet(); finishQuiz(true); };
      $('#qd', s).onclick = () => { closeSheet(); quiz = null; nav('setup', {}, { replace: true }); };
      $('#qc', s).onclick = () => { closeSheet(); if (!quiz.answered) startTimer(); };
    });
  };
  function finishQuiz(aborted) {
    stopTimer();
    const qs = quiz.questions.filter(q => q.result);
    if (!qs.length) { quiz = null; return nav('setup', {}, { replace: true }); }
    const diff = quiz.cfg.mode === 'flip' ? 'flip' : quiz.cfg.difficulty;
    const sc = Quiz.scoreAttempt(qs, diff);
    const spec = quiz.kind === 'hsk' ? Quiz.EXAM[quiz.level] : null;
    if (spec) sc.score = Math.round(sc.percent / 100 * spec.max);
    const a = {
      id: uid(), ts: quiz.startedAt, endedAt: Date.now(), durationMs: Date.now() - quiz.startedAt,
      mode: quiz.kind === 'hsk' ? 'hsk' : quiz.cfg.mode, level: quiz.level, difficulty: quiz.kind === 'hsk' ? 'exam' : diff,
      deckIds: quiz.deckIds, deckName: quiz.cfg.mode === 'sentence' ? 'Фразы' : quiz.deckIds.map(id => (deckById(id) || {}).name || id).join(', '),
      show: quiz.kind === 'hsk' ? 'exam' : quiz.cfg.show, guess: quiz.cfg.show === 'mixed' ? ['all'] : (quiz.cfg.guess || []), order: quiz.cfg.order, timer: quiz.cfg.timer || 0,
      total: qs.length, planned: quiz.questions.length, aborted: !!aborted,
      correct: sc.correct, partial: sc.partial, wrong: qs.length - sc.correct - sc.partial, percent: sc.percent, score: sc.score,
      passed: quiz.kind === 'hsk' ? sc.percent >= 60 : null, examMax: spec ? spec.max : null,
      questions: qs.map(q => ({ cardId: q.cardId, hanzi: q.card.hanzi, pinyin: q.card.pinyin, ru: q.card.ru, show: q.show, guess: q.guess, answer: q.answer, parts: q.result.parts, fraction: q.result.fraction, ok: q.result.ok, ms: q.ms })),
    };
    a.points = Campaign.attemptPoints(a);
    quiz = null;
    saveAttempt(a).then(ev => { lastEvents = { id: a.id, ...ev }; Sound.finish(a.percent >= 60); nav('result', { id: a.id }, { replace: true }); });
  }

  /* ── результат ── */
  function ring(pct) {
    const r = 48, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    const col = pct >= 80 ? 'var(--jade)' : pct >= 60 ? 'var(--gold)' : 'var(--vermilion)';
    return `<svg class="ring" viewBox="0 0 116 116"><circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--paper-3)" stroke-width="10"/><circle cx="58" cy="58" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 58 58)" style="transition:stroke-dashoffset .8s"/><text x="58" y="66" text-anchor="middle" font-size="26">${pct}%</text></svg>`;
  }
