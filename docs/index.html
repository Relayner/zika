<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>字卡 — Карточки китайского</title>
<meta name="description" content="Флэш-карточки китайского: иероглиф, пиньинь, перевод. HSK 1–3, тесты, статистика.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="字卡">
<meta name="theme-color" content="#6e1b2b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 字卡 — азиатский стиль: рисовая бумага, тушь, киноварь, бордо, золото */
:root {
  --paper: #f4ead6; --paper-2: #ecdfc3; --paper-3: #e1cfab;
  --card: #fbf6ea;
  --ink: #2b1d18; --ink-2: #5c463c; --ink-3: #8e7a6b;
  --vermilion: #c4371f; --vermilion-2: #e0502f;
  --bordeaux: #6e1b2b; --bordeaux-2: #8c2439; --bordeaux-3: #4f1220;
  --gold: #c49a3c; --gold-2: #e3c170; --gold-3: #f1dea6;
  --jade: #3c7d5c; --jade-2: #5aa37c;
  --ok-bg: rgba(60, 125, 92, .16); --bad-bg: rgba(196, 55, 31, .16); --half-bg: rgba(196, 154, 60, .22);
  --line: rgba(43, 29, 24, .14); --line-2: rgba(43, 29, 24, .26);
  --shadow: 0 6px 20px rgba(70, 35, 20, .16);
  --tab-h: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --noise-op: .45;
  --font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif", Georgia, "Times New Roman", serif;
  --hanzi: "Songti SC", "STSong", "Kaiti SC", "STKaiti", "PingFang SC", "Hiragino Sans GB", "Noto Serif SC", "Noto Sans CJK SC", serif;
  color-scheme: light;
}
:root[data-theme="dark"], :root.dark-vars {
  --paper: #15100f; --paper-2: #221617; --paper-3: #301d1f;
  --card: #241719;
  --ink: #f1e6d1; --ink-2: #cfbda5; --ink-3: #9c8979;
  --vermilion: #e2492f; --vermilion-2: #f06347;
  --bordeaux: #7d2032; --bordeaux-2: #9b2b42; --bordeaux-3: #4a1220;
  --gold: #d2ad55; --gold-2: #e9cd82; --gold-3: #6a5422;
  --jade: #5fb08a; --jade-2: #7fc8a4;
  --ok-bg: rgba(95, 176, 138, .18); --bad-bg: rgba(226, 73, 47, .2); --half-bg: rgba(210, 173, 85, .22);
  --line: rgba(241, 230, 209, .13); --line-2: rgba(241, 230, 209, .26);
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  --noise-op: .22;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15100f; --paper-2: #221617; --paper-3: #301d1f;
    --card: #241719;
    --ink: #f1e6d1; --ink-2: #cfbda5; --ink-3: #9c8979;
    --vermilion: #e2492f; --vermilion-2: #f06347;
    --bordeaux: #7d2032; --bordeaux-2: #9b2b42; --bordeaux-3: #4a1220;
    --gold: #d2ad55; --gold-2: #e9cd82; --gold-3: #6a5422;
    --jade: #5fb08a; --jade-2: #7fc8a4;
    --ok-bg: rgba(95, 176, 138, .18); --bad-bg: rgba(226, 73, 47, .2); --half-bg: rgba(210, 173, 85, .22);
    --line: rgba(241, 230, 209, .13); --line-2: rgba(241, 230, 209, .26);
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    --noise-op: .22;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.4; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--noise-op);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 80% at 50% -10%, rgba(196, 154, 60, .16), transparent 60%), radial-gradient(90% 60% at 50% 110%, rgba(110, 27, 43, .18), transparent 60%);
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--bordeaux); }
::selection { background: var(--gold-3); }

#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#view { flex: 1; padding: calc(var(--safe-t) + 14px) 16px calc(var(--tab-h) + var(--safe-b) + 24px); animation: fade .22s ease-out; }
body.no-tabs #view { padding-bottom: calc(var(--safe-b) + 24px); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── нижняя навигация ── */
#tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; z-index: 20;
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: flex;
  background: linear-gradient(180deg, var(--bordeaux-2), var(--bordeaux-3)); border-top: 2px solid var(--gold);
  box-shadow: 0 -6px 20px rgba(40, 10, 15, .25);
}
body.no-tabs #tabbar { display: none; }
.tab {
  flex: 1; border: 0; background: transparent; color: rgba(255, 238, 215, .62); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 0 4px; transition: color .15s;
}
.tab .ico { font-family: var(--hanzi); font-size: 22px; line-height: 1.1; font-weight: 400; }
.tab.active { color: var(--gold-2); }
.tab.active .ico { text-shadow: 0 0 12px rgba(227, 193, 112, .6); }
.tab:active { transform: scale(.94); }

/* ── типографика ── */
.vh { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.vh .grow { flex: 1; min-width: 0; }
.title { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0; color: var(--ink); letter-spacing: .01em; }
.sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.h2 { font-family: var(--serif); font-size: 18px; margin: 22px 0 10px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
.muted { color: var(--ink-3); font-weight: 400; }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; line-height: 1.45; }
.flabel { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
.mt { margin-top: 14px; } .mt0 { margin-top: 0 !important; } .mb { margin-bottom: 14px; }
.empty { padding: 22px 14px; text-align: center; color: var(--ink-3); font-size: 14px; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty.gold { color: var(--ink-2); border-color: var(--gold); background: linear-gradient(180deg, rgba(227,193,112,.12), transparent); font-family: var(--serif); font-size: 16px; }
.warn { background: var(--half-bg); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

.seal {
  flex: none; width: 40px; height: 40px; border-radius: 6px; background: var(--vermilion); color: #fff6e8; font-family: var(--hanzi);
  display: grid; place-items: center; font-size: 22px; font-weight: 700; transform: rotate(-5deg);
  box-shadow: inset 0 0 0 2px rgba(255, 246, 232, .55), inset 0 0 0 4px var(--vermilion), 0 3px 8px rgba(196, 55, 31, .35);
}
.seal.big { width: 96px; height: 96px; font-size: 58px; border-radius: 14px; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  font-size: 20px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.icon-btn:active { transform: scale(.94); }

/* ── панели ── */
.panel { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.panel.ornate::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--gold); border-radius: 12px; opacity: .55; pointer-events: none; }
.panel.ornate::after {
  content: ""; position: absolute; right: 12px; top: 12px; width: 14px; height: 14px; opacity: .55; pointer-events: none;
  border-top: 2px solid var(--gold); border-right: 2px solid var(--gold);
}
.hero { padding: 18px 16px; background: linear-gradient(160deg, var(--card), var(--paper-2)); }
.hero-greet { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 10px; }
.hero-row { display: flex; gap: 8px; }
.hero-row > div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: rgba(110, 27, 43, .06); }
.hero-row .v, .tile .v { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--bordeaux); line-height: 1.1; }
.hero-row .l, .tile .l { font-size: 11px; color: var(--ink-3); margin-top: 2px; letter-spacing: .02em; }
.proverb { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.proverb .hanzi { font-size: 20px; color: var(--ink); }
.proverb .pinyin { font-size: 13px; }
.proverb .ru { font-size: 13px; text-align: left; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.big-btn {
  position: relative; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 16px 12px 14px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); text-align: left;
  overflow: hidden; transition: transform .08s;
}
.big-btn .bi { font-family: var(--hanzi); font-size: 40px; font-weight: 400; color: var(--bordeaux); line-height: 1; margin-bottom: 8px; }
.big-btn small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.big-btn::after { content: ""; position: absolute; right: -18px; bottom: -18px; width: 64px; height: 64px; border-radius: 50%; border: 10px solid var(--gold); opacity: .14; }
.big-btn:active { transform: scale(.97); }

/* ── кнопки ── */
.btn {
  appearance: none; border: 0; border-radius: 13px; padding: 14px 18px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  user-select: none; transition: transform .08s, opacity .15s; line-height: 1.2;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-primary { background: linear-gradient(180deg, var(--bordeaux-2), var(--bordeaux)); color: #fff3e0; box-shadow: 0 2px 0 var(--gold), 0 8px 16px rgba(110, 27, 43, .3); }
.btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line-2); }
.btn-danger { background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion)); color: #fff6ec; }
.btn-jade { background: linear-gradient(180deg, var(--jade-2), var(--jade)); color: #f3fff8; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
.btn-lg { padding: 17px 20px; font-size: 18px; }
.btns { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.btns.row2 { flex-direction: row; } .btns.row2 .btn { flex: 1; }

/* ── строки списков ── */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; font-size: 15px; }
.row:active { background: rgba(110, 27, 43, .06); }
.row-t { font-weight: 600; color: var(--ink); }
.row-s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.row-r { display: flex; align-items: center; gap: 8px; flex: none; }
.row-card { min-width: 0; }
.chev { color: var(--ink-3); font-size: 20px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; }
.badge.good { background: var(--ok-bg); color: var(--jade); } .badge.mid { background: var(--half-bg); color: #8a6a14; } .badge.bad { background: var(--bad-bg); color: var(--vermilion); }
:root[data-theme="dark"] .badge.mid { color: var(--gold-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.mid { color: var(--gold-2); } }

/* ── элементы форм ── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: all .12s; }
.chip small { font-weight: 400; color: var(--ink-3); margin-left: 2px; }
.chip.on { background: var(--gold); border-color: var(--gold); color: #2b1d18; } .chip.on small { color: #5c463c; }
.seg { display: flex; background: var(--paper-2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; color: var(--ink-2); font-size: 13.5px; font-weight: 600; transition: all .12s; white-space: nowrap; }
.seg button.on { background: var(--bordeaux); color: #fff3e0; box-shadow: 0 2px 6px rgba(110, 27, 43, .3); }
.top-seg { margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; margin-bottom: 5px; }
.field label .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
.inp { width: 100%; font-size: 17px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); outline: none; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(196, 154, 60, .25); }
.inp.ok { border-color: var(--jade); background: var(--ok-bg); } .inp.half { border-color: var(--gold); background: var(--half-bg); } .inp.bad { border-color: var(--vermilion); background: var(--bad-bg); }
textarea.inp { min-height: 160px; resize: vertical; font-size: 15px; line-height: 1.45; }
select.inp { appearance: none; -webkit-appearance: none; }
.search { margin: 10px 0 4px; font-size: 16px; }
.pv { font-family: var(--serif); font-style: italic; color: var(--bordeaux); font-size: 17px; min-height: 22px; margin-top: 5px; padding-left: 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle { width: 52px; height: 31px; border-radius: 16px; background: var(--paper-3); border: 0; position: relative; transition: background .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.toggle.on { background: var(--jade); } .toggle.on::after { transform: translateX(21px); }

/* ── иероглифы и карточка ── */
.hanzi { font-family: var(--hanzi); font-weight: 500; color: var(--ink); line-height: 1.15; }
.big-hanzi { font-size: 92px; text-align: center; letter-spacing: .02em; }
.big-hanzi.len3 { font-size: 72px; } .big-hanzi.len4 { font-size: 58px; } .big-hanzi.len5 { font-size: 44px; }
.hanzi.mid { font-size: 44px; text-align: center; } .hanzi.mid.len5 { font-size: 30px; }
.hanzi.sm { font-size: 20px; }
.pinyin { font-family: var(--serif); font-style: italic; color: var(--bordeaux); font-size: 24px; text-align: center; }
.pinyin.big { font-size: 38px; } .pinyin.sm { font-size: 15px; margin-left: 8px; }
.ru { color: var(--ink-2); font-size: 18px; text-align: center; line-height: 1.35; }
.ru.big { font-size: 26px; font-family: var(--serif); color: var(--ink); } .ru.sm { font-size: 13.5px; text-align: left; color: var(--ink-3); margin-top: 1px; }
.note { font-size: 13px; color: var(--ink-3); text-align: center; margin-top: 6px; font-style: italic; }

/* ── тест ── */
.qbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.progress { flex: 1; height: 7px; background: var(--paper-3); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bordeaux), var(--vermilion)); border-radius: 4px; transition: width .3s; }
.progress.gold > i { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.qcount { font-family: var(--serif); font-size: 15px; color: var(--ink-2); min-width: 44px; text-align: right; }
.qtimer { min-width: 36px; height: 36px; padding: 0 6px; border-radius: 18px; border: 2px solid var(--gold); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; color: var(--bordeaux); white-space: nowrap; font-size: 14px; }
.qtimer.urgent { border-color: var(--vermilion); color: var(--vermilion); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.qlabel { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); text-align: center; margin-bottom: 10px; font-weight: 700; }
.qcard { padding: 26px 16px 22px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; }
.opts { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
.opt {
  width: 100%; text-align: left; padding: 13px 14px; border-radius: 13px; background: var(--card); border: 1px solid var(--line-2); color: var(--ink); font-size: 16.5px; line-height: 1.3;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; transition: transform .08s; box-shadow: 0 2px 6px rgba(0,0,0,.05);
}
.opt:active { transform: scale(.985); }
.opt .opt-hanzi { font-family: var(--hanzi); font-size: 24px; }
.opt .opt-pinyin { font-family: var(--serif); font-style: italic; color: var(--bordeaux); }
.opt .opt-ru { color: var(--ink-2); font-size: 15px; }
.opt .opt-sep { color: var(--gold); }
.opt.correct { background: var(--ok-bg); border-color: var(--jade); box-shadow: 0 0 0 2px var(--jade) inset; }
.opt.wrong { background: var(--bad-bg); border-color: var(--vermilion); }
.opt:disabled { opacity: .85; }
.shake { animation: shake .45s; }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
.inputs { margin-top: 6px; }
.fb { margin-top: 14px; animation: fade .25s; }
.verdict { font-family: var(--serif); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.verdict.ok { color: var(--jade); } .verdict.half { color: var(--gold); } .verdict.bad { color: var(--vermilion); }
.fb-card { padding: 8px 0 12px; border-bottom: 1px dashed var(--line-2); margin-bottom: 10px; }
.fb-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.fb-p { color: var(--ink-3); min-width: 72px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.fb-a { flex: 1; font-weight: 600; } .fb-a.exact { color: var(--jade); } .fb-a.tones { color: var(--gold); } .fb-a.wrong { color: var(--vermilion); text-decoration: line-through; }
.fb-v { font-size: 12px; color: var(--ink-3); }
.fb .btn { margin-top: 10px; }

/* ── перевёртыш ── */
.flashcard { perspective: 1400px; height: 360px; margin: 4px 0 16px; cursor: pointer; }
.fc-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4, .15, .2, 1); }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border-radius: 20px; border: 1px solid var(--line);
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 18px; overflow: hidden;
}

/* ── результат ── */

.stamp {
  position: absolute; right: 14px; top: 10px; padding: 6px 10px; border: 3px solid currentColor; border-radius: 6px; font-family: var(--hanzi); font-size: 22px; font-weight: 700;
  transform: rotate(-12deg); opacity: .85; line-height: 1; text-align: center; mix-blend-mode: multiply;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: screen; } }
.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }

/* ── статистика ── */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

/* ── прочее ── */

@keyframes flashA { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

#modal.open { display: flex; }

@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }

#splash { position: fixed; inset: 0; z-index: 100; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s; }
#splash.hide { opacity: 0; pointer-events: none; }
.splash-t { font-family: var(--serif); font-size: 34px; font-weight: 700; color: var(--bordeaux); letter-spacing: .05em; }
.install-note { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.install-note b { color: var(--ink); }
kbd { font-family: var(--font); font-size: 12px; padding: 2px 6px; border-radius: 5px; background: var(--paper-2); border: 1px solid var(--line-2); }
@media (min-width: 600px) { .big-hanzi { font-size: 104px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── поход и профиль ── */
.avatar-btn { flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gold); background: var(--card); padding: 0; overflow: visible; box-shadow: 0 2px 8px rgba(0,0,0,.12); }

.dbar { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; height: 16px; }
.dbar i { display: block; border-radius: 3px; background: var(--paper-3); position: relative; }
.dbar i.rank { background: var(--gold-3); }

.dbar i.cur { box-shadow: inset 0 0 0 2px var(--gold); }
.dbar i.tick::before { content: ""; position: absolute; left: -2px; top: -4px; bottom: -4px; width: 1px; background: var(--ink-3); opacity: .5; }

.dots { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
.dots i, .legend i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--paper-3); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }

.rankup-t { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--vermilion); margin-bottom: 6px; }

.chest-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }

.r-common { --rc: var(--ink-3); } .r-uncommon { --rc: var(--jade); } .r-rare { --rc: #4a6b8a; } .r-epic { --rc: #8a3b7e; } .r-legendary { --rc: var(--gold); }
.inv-cell.r-uncommon, .inv-cell.r-rare, .inv-cell.r-epic, .inv-cell.r-legendary, .reveal-card { border-color: var(--rc); }

.rar-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; font-size: 11px; color: var(--ink-3); }

/* ── настоящий экзамен HSK ── */
.ex-pic { display: block; width: 62%; max-width: 220px; margin: 10px auto 0; border-radius: 14px; border: 2px solid var(--line-2); }
.ex-pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ex-picbtn { position: relative; border: 2px solid var(--line-2); border-radius: 12px; background: var(--card); padding: 4px; }
.ex-picbtn img { width: 100%; border-radius: 9px; display: block; }
.ex-picbtn:active { transform: scale(.96); }
.ex-letter { position: absolute; left: 6px; top: 6px; z-index: 2; background: var(--bordeaux); color: #fff3e0; font-weight: 700; font-size: 12px; border-radius: 8px; padding: 1px 7px; }
.opt .ex-letter { position: static; margin-right: 8px; }
.ex-audio { text-align: center; padding: 8px 0; }
.say-ico { font-size: 52px; display: inline-block; }
.say-ico.talking { animation: pulse .5s infinite alternate; }
.ex-word { text-align: center; }
.ex-opt { font-size: 19px; }
.ex-pics.pool6 { grid-template-columns: repeat(3, 1fr); }
.ex-picbtn.used { opacity: .3; filter: grayscale(.8); }
.ex-star { font-size: 20px; font-family: var(--hanzi); text-align: center; margin-top: 12px; padding: 10px; border: 1px dashed var(--line-2); border-radius: 10px; }
.arr-line { min-height: 56px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ── Экзамен: заставки этапов и блоки сопоставления ── */
.sec-banner { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, var(--bordeaux, #6d1a24), #7a1f2b); color: #f7ead8; border-radius: var(--r, 14px); padding: 14px 16px; margin-bottom: 12px; }
.sec-banner .sec-zh { font-family: var(--serif, serif); font-size: 34px; line-height: 1; }
.sec-banner .sec-note { color: #e8cfae; font-size: 13px; margin-top: 2px; }
.stage-card { position: relative; overflow: hidden; }
.stage-wm { position: absolute; right: -6px; top: -18px; font-family: var(--serif, serif); font-size: 110px; line-height: 1; color: var(--bordeaux, #6d1a24); opacity: .06; pointer-events: none; }
.stage-chip { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--bordeaux, #6d1a24); border: 1px solid var(--gold, #c9a227); border-radius: 12px; padding: 2px 10px; margin-bottom: 8px; }
.stage-t { font-family: var(--serif, serif); font-size: 22px; margin: 0 0 2px; color: var(--bordeaux, #6d1a24); }
.stage-n { color: var(--ink-2, #6b6156); font-size: 13px; margin-bottom: 8px; }
.stage-rule { margin: 0; line-height: 1.55; }
.blk-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.blk-row { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--card, #fffdf6); border: 1.5px solid var(--line, #e4d8c2); border-radius: 12px; padding: 8px 10px; font: inherit; color: inherit; }
.blk-row.on { border-color: var(--bordeaux, #6d1a24); box-shadow: 0 0 0 1px var(--bordeaux, #6d1a24); }
.blk-spk { visibility: hidden; }
.blk-row.speaking .blk-spk { visibility: visible; }
.blk-num { font-family: var(--serif, serif); font-weight: 700; color: var(--ink-2, #6b6156); min-width: 22px; }
.blk-txt { flex: 1; font-size: 16px; }
.blk-badge { min-width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line, #e4d8c2); display: grid; place-items: center; font-weight: 700; color: var(--ink-2, #6b6156); }
.blk-row.done .blk-badge { background: var(--bordeaux, #6d1a24); border-color: var(--bordeaux, #6d1a24); color: #fff; }
.blk-tag { position: absolute; top: 4px; right: 4px; background: var(--bordeaux, #6d1a24); color: #fff; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 1px 6px; }
.opt .blk-tag { position: static; margin-left: auto; }
.opt.used, .ex-picbtn.used { opacity: .55; }
.err-stage { font-weight: 700; color: var(--bordeaux, #6d1a24); margin: 10px 0 6px; font-family: var(--serif, serif); }
.err-item { border-top: 1px dashed var(--line, #e4d8c2); padding: 8px 0; }
.err-q { font-size: 15px; margin-bottom: 4px; }
.err-a { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.ok-t { color: var(--jade, #2e7d5b); }
.bad-t { color: var(--danger, #b3392f); }

.res-sec .fb-p { font-size: 13px; min-width: 0; }
.res-sec .fb-a, .res-sec .fb-v { white-space: nowrap; }
.res-sec .fb-p { text-transform: none; letter-spacing: 0; }

/* Приглашение включить напоминания Луна */
.push-invite { border: 1.5px dashed var(--gold, #c9a227); }
.push-invite .pi-t { font-weight: 700; color: var(--bordeaux, #6d1a24); margin-bottom: 4px; }
.push-invite .pi-x { color: var(--ink-2, #6b6156); font-size: 14px; line-height: 1.45; margin-bottom: 10px; }
.push-invite .pi-ico { margin-right: 8px; display: inline-block; }
/* Программа: карта блоков, лента, спринт */
.lvl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.lvl-row { display: flex; align-items: center; gap: 12px; }
.lvl-badge { width: 38px; height: 38px; border-radius: 10px; background: var(--bordeaux, #6d1a24); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.blk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.blk-card { position: relative; text-align: left; background: var(--card, #fffdf6); border: 1.5px solid var(--line, #e4d8c2); border-radius: 12px; padding: 10px 12px; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 3px; }
.blk-card.s-work { border-color: var(--gold, #c9a227); }
.blk-card.s-done, .blk-card.s-gold { border-color: var(--jade, #2e7d5b); }
.blk-seal { position: absolute; top: 8px; right: 10px; font-size: 18px; color: var(--ink-2, #6b6156); opacity: .5; }
.blk-card.s-done .blk-seal, .blk-card.s-gold .blk-seal { color: var(--jade, #2e7d5b); opacity: 1; }
.blk-zh { font-size: 19px; }
.blk-ru { font-size: 13px; color: var(--ink-2, #6b6156); line-height: 1.3; }
.blk-bar { height: 4px; border-radius: 2px; background: var(--line, #e4d8c2); overflow: hidden; margin-top: 4px; }
.blk-bar i { display: block; height: 100%; background: var(--bordeaux, #6d1a24); }
.blk-n { font-size: 12px; color: var(--ink-2, #6b6156); }
.feed-top { display: flex; align-items: center; gap: 10px; }
.gex { display: flex; flex-direction: column; gap: 1px; margin: 8px 0; }
.sprint-res { display: flex; align-items: center; gap: 14px; }
.sr-seal { font-size: 34px; }
.sprint-res.v-jade .sr-seal { color: var(--jade, #2e7d5b); }
.sprint-res.v-gold .sr-seal { color: var(--gold, #c9a227); }
.sprint-res.v-danger .sr-seal { color: var(--danger, #b3392f); }
.sr-pts { font-family: var(--serif, serif); font-size: 30px; font-weight: 700; color: var(--bordeaux, #6d1a24); white-space: nowrap; }
.sr-pts small { font-size: 12px; font-weight: 400; margin-left: 3px; }
.big-btn.t-prog { color: var(--jade, #2e7d5b); }
.blk-runs { color: var(--gold, #c9a227); font-weight: 700; }
/* Боссы */
.boss-card { display: flex; gap: 12px; align-items: flex-start; }
.boss-card.locked { opacity: .72; }
.boss-por { width: 76px; height: 76px; border-radius: 12px; flex: none; border: 2px solid var(--line, #e4d8c2); object-fit: cover; }
.boss-card.ready .boss-por { border-color: var(--danger, #b3392f); }
.boss-por.big { width: 120px; height: 120px; }
.boss-n { font-family: var(--serif, serif); font-weight: 700; font-size: 17px; }
.boss-lore { color: var(--ink-2, #6b6156); font-size: 13.5px; line-height: 1.4; margin: 4px 0 6px; }
.boss-meta { font-size: 13px; margin-bottom: 2px; }
.boss-when { font-size: 13px; color: var(--ink-2, #6b6156); margin-bottom: 8px; }
.fight-card { text-align: center; }
.fight-card .boss-por.big { margin: 0 auto 8px; display: block; }
.fight-card .boss-por.hit { filter: grayscale(.4) brightness(.85); }
.fight-card .boss-por.laugh { transform: scale(1.04); }
.fight-say { font-size: 26px; margin: 10px 0; line-height: 1.5; cursor: pointer; }
.fight-tr { color: var(--ink-2, #6b6156); font-size: 14px; margin-top: 6px; line-height: 1.45; }
.fight-fb { margin-top: 10px; font-size: 20px; }
.fight-fb.ok { color: var(--jade, #2e7d5b); }
.fight-fb.bad { color: var(--danger, #b3392f); }
.fight-fb span { font-size: 15px; color: var(--ink-2, #6b6156); display: block; margin-top: 2px; }
.fight-acts { display: grid; gap: 8px; }
.hint-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hint-btn { background: var(--card, #fffdf6); border: 1.5px solid var(--gold, #c9a227); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; color: inherit; }
.hint-btn .zh { font-size: 20px; color: var(--bordeaux, #6d1a24); }
.hint-btn small { font-size: 11px; color: var(--ink-2, #6b6156); }
.hint-btn.used { opacity: .4; border-style: dashed; }
.btn.rec { animation: recpulse 1s infinite; }
@keyframes recpulse { 50% { opacity: .6; } }
.fight-res { display: flex; align-items: center; gap: 14px; }
.fight-res.win { border-color: var(--jade, #2e7d5b); }
.fight-res.lose { border-color: var(--danger, #b3392f); }
.loot { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.loot-it { text-align: center; font-size: 12px; }
.loot-it img { width: 100%; border-radius: 10px; }
.loot-it span { display: block; margin-top: 4px; }
.loot-it small { color: var(--ink-2, #6b6156); }
.big-btn.t-boss { color: var(--danger, #b3392f); }
.fight-clock { text-align: center; font-family: var(--serif, serif); font-weight: 700; color: var(--ink-2, #6b6156); margin: -2px 0 8px; font-variant-numeric: tabular-nums; }
.fight-clock.urgent { color: var(--danger, #b3392f); }
.boss-terms { font-size: 12.5px; color: var(--ink-2, #6b6156); margin-bottom: 3px; }
/* Вторая фаза боя */
.boss-por.big.rage { animation: rageShake .45s ease-in-out infinite; box-shadow: 0 0 0 2px var(--danger, #b3392f); }
@keyframes rageShake { 25% { transform: translateX(-2px) rotate(-1deg); } 75% { transform: translateX(2px) rotate(1deg); } }
@media (prefers-reduced-motion: reduce) { .boss-por.big.rage { animation: none; } }
.rage-tag { font-size: 12px; color: var(--danger, #b3392f); font-weight: 700; white-space: nowrap; }
.rage-cry { margin: 8px auto 0; max-width: 92%; border: 1.5px solid var(--danger, #b3392f); border-radius: 12px; padding: 8px 12px; background: color-mix(in srgb, var(--danger, #b3392f) 8%, transparent); }
.rage-cry .zh { display: block; font-size: 19px; }
.rage-cry small { color: var(--ink-2, #6b6156); }
.heard { margin-top: 10px; font-size: 15px; color: var(--ink-2, #6b6156); border: 1px dashed var(--line, #e4d8c2); border-radius: 10px; padding: 7px 10px; }
.heard b { color: var(--ink, #2c2620); font-size: 18px; }
.heard.none { color: var(--danger, #b3392f); }

window.Stats = (() => {
  const pad = n => String(n).padStart(2, '0');
  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  /* Карточки: сколько раз спрашивали, верно, частично, последняя, серия верных подряд */
  function cardStats(attempts) {
    const m = {};
    const sorted = attempts.slice().sort((a, b) => a.ts - b.ts);
    for (const a of sorted) for (const q of a.questions || []) {
      const s = m[q.cardId] || (m[q.cardId] = { asked: 0, correct: 0, partial: 0, wrong: 0, lastAt: 0, lastOk: null, streak: 0, timeMs: 0 });
      s.asked++;
      if (q.ok) { s.correct++; s.streak++; } else { s.streak = 0; if (q.fraction > 0) s.partial++; else s.wrong++; }
      s.lastAt = a.ts; s.lastOk = q.ok; s.timeMs += q.ms || 0;
    }
    for (const s of Object.values(m)) { s.accuracy = s.asked ? s.correct / s.asked : 0; s.mastered = s.streak >= 3; }
    return m;
  }

  function streaks(attempts) {
    const days = [...new Set(attempts.map(a => dayKey(a.ts)))].sort();
    let best = 0, run = 0, prev = null;
    for (const k of days) {
      const d = new Date(k + 'T00:00:00');
      if (prev && (d - prev) / 864e5 === 1) run++; else run = 1;
      best = Math.max(best, run); prev = d;
    }
    const set = new Set(days);
    let cur = 0; const d = new Date(); d.setHours(0, 0, 0, 0);
    if (!set.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
    while (set.has(dayKey(d.getTime()))) { cur++; d.setDate(d.getDate() - 1); }
    return { current: cur, best, days: days.length };
  }

  function overview(attempts) {
    const n = attempts.length;
    const sum = f => attempts.reduce((a, x) => a + (f(x) || 0), 0);
    const st = streaks(attempts);
    const questions = sum(a => a.total), timeMs = sum(a => a.durationMs);
    return {
      attempts: n,
      avgPercent: n ? Math.round(sum(a => a.percent) / n) : 0,
      avgScore: n ? Math.round(sum(a => a.score) / n) : 0,
      best: n ? Math.max(...attempts.map(a => a.percent)) : 0,
      worst: n ? Math.min(...attempts.map(a => a.percent)) : 0,
      questions, correct: sum(a => a.correct), timeMs,
      avgQuestionMs: questions ? Math.round(timeMs / questions) : 0,
      days: st.days, streak: st.current, bestStreak: st.best,
      passed: attempts.filter(a => a.passed === true).length,
      hskTests: attempts.filter(a => a.mode === 'hsk').length,

    const g = {};

      if (k == null) continue;

      r.n++; r.sumP += a.percent; r.sumS += a.score;

      r.last = Math.max(r.last, a.ts); r.questions += a.total; r.correct += a.correct; r.timeMs += a.durationMs || 0;

    const out = [], now = new Date();
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      out.push({ key: dayKey(d.getTime()), day: d.getDate(), n: 0, sumP: 0, questions: 0, timeMs: 0, avgPercent: null });

    const idx = Object.fromEntries(out.map((o, i) => [o.key, i]));
    for (const a of attempts) {
      const i = idx[dayKey(a.ts)];
      if (i == null) continue;
      const o = out[i]; o.n++; o.sumP += a.percent; o.questions += a.total; o.timeMs += a.durationMs || 0;
    }
    out.forEach(o => { o.avgPercent = o.n ? Math.round(o.sumP / o.n) : null; });

  }

  return { dayKey, cardStats, streaks, overview, groupBy, daily };

/* Поход: очки за день, переход (кап), марш-бросок 兼程 (5× кап = день за два), пропуск = откат на день.

  const CAP = 400, ULTRA_MULT = 5, ULTRA = CAP * ULTRA_MULT, RANKS = 10;

  const RANK_AT = RANK_DAYS.reduce((acc, d) => (acc.push(acc[acc.length - 1] + d), acc), [0]);   /* дней к началу каждого ранга */
  const TOTAL_DAYS = RANK_AT[RANK_AT.length - 1];   /* 63 дня до высшего ранга */
  const DAYS_PER_RANK = RANK_DAYS[0];
  const BASE = { quiz: { easy: 2, medium: 4, hard: 8 }, write: { easy: 5, medium: 7, hard: 10 }, listen: { easy: 3, medium: 5, hard: 9 }, sentence: { easy: 4, medium: 7, hard: 12 }, flip: 1, hsk: 4 };
  const BONUS = { finish: 5, perfect: 10, pass: 30 };
  const NAMES = { cap: 'Переход', ultra: 'Марш-бросок', ultraZh: '兼程' };

    let base;
    if (a.mode === 'flip') base = BASE.flip;
    else if (a.mode === 'hsk') base = BASE.hsk;

    else base = BASE.quiz[a.difficulty] || 2;

    let p = 0;
    for (const q of a.questions || []) p += questionPoints(a, q);
    if (!a.aborted && a.total >= 10) p += BONUS.finish;
    if (a.percent === 100 && a.total >= 10) p += BONUS.perfect;

    if (a.level) return a.level;

    if (a.block) return 'blk:' + a.block;

/* Движок настоящего экзамена HSK: собирает случайный вариант из банков по структуре реального экзамена. */
window.HskReal = (() => {
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    ['p41', '咖啡', 'kāfēi'], ['p42', '牛奶', 'niúnǎi'], ['p43', '西瓜', 'xīguā'], ['p44', '鸡蛋', 'jīdàn'],
    ['p45', '鱼', 'yú'], ['p46', '面条', 'miàntiáo'], ['p47', '手机', 'shǒujī'], ['p48', '手表', 'shǒubiǎo'],
    ['p49', '报纸', 'bàozhǐ'], ['p50', '药', 'yào'], ['p51', '自行车', 'zìxíngchē'], ['p52', '公共汽车', 'gōnggòng qìchē'],
    ['p53', '火车', 'huǒchē'], ['p54', '跑步', 'pǎobù'], ['p55', '踢足球', 'tī zúqiú'], ['p56', '打篮球', 'dǎ lánqiú'],
    ['p57', '游泳', 'yóuyǒng'], ['p58', '跳舞', 'tiàowǔ'], ['p59', '唱歌', 'chànggē'], ['p60', '下雪', 'xià xuě'],
  ].map(([id, h, py]) => ({ id, h, py }));
  const ALL_PICS = () => [...window.HSK1EXAM.PICS, ...PIC_WORDS2];
  const availPics = () => {
    const av = new Set(window.PICS_AVAILABLE || []);
    return ALL_PICS().filter(p => av.has(p.id));
  };
  const picById = id => ALL_PICS().find(p => p.id === id);

  /* ── Глубокий рандомайзер ──
     Каждый банк помнит, какие задания уже выпадали, и следующий вариант собирается
     сначала из тех, что давно не встречались. Повтор возможен только когда банк исчерпан. */
  const SEEN_KEY = 'zika:examSeen';
  const loadSeen = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } };
  const saveSeen = s => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) { /* не критично */ } };
  const itemKey = it => [
    Array.isArray(it.say) ? it.say.join('|') : (it.say || ''),
    it.q || '', it.t || '', it.text || '', it.star || '',
    it.a || '', it.b || '', it.ans || '',                       /* диалоги {a,b} и пропуски {ans} тоже должны различаться */
    Array.isArray(it.parts) ? it.parts.join('') : '',
    Array.isArray(it.chunks) ? it.chunks.join('') : '',
  ].join('\u00a7');
  let pendingSeen = null;
  /* n заданий из банка: сначала не встречавшиеся, потом самые давние */
  function pick(bank, n, tag, uniqBy) {

    const seen = pendingSeen || (pendingSeen = loadSeen());
    const used = seen[tag] || [];
    const age = new Map(used.map((k, i) => [k, i + 1])); /* больше — свежее, значит брать в последнюю очередь */
    const fresh = shuffle(bank.filter(it => !age.has(itemKey(it))));
    const stale = shuffle(bank.filter(it => age.has(itemKey(it)))).sort((a, b) => age.get(itemKey(a)) - age.get(itemKey(b)));
    const queue = [...fresh, ...stale];

    for (const it of queue) {
      if (out.length >= n) break;

      if (uniqBy) { const u = uniqBy(it); if (taken.has(u)) continue; taken.add(u); }
      out.push(it);

    const cap = Math.max(n, Math.floor(bank.length * 0.6));

  /* Экзамен HSK 1: 听力 4×5 + 阅读 4×5. Вопросы без мгновенной проверки — разбор в конце, как на настоящем. */
  function buildExam1() {
    const B = window.HSK1EXAM;
    const pics = shuffle(availPics());
    if (pics.length < 16) throw new Error('Мало картинок для экзамена');
    const avail = new Set(pics.map(p => p.id));
    const sentPool = pick(B.SENT.filter(s => avail.has(s.pic)), 10, 'e1:SENT');
    const dlgPool = pick(B.DLG.filter(d => avail.has(d.pic)), 5, 'e1:DLG');
    let picCursor = 0;
    const takePics = n => pics.slice(picCursor, picCursor += n);
    const qs = [];
    /* Слушание ч.1: слово + картинка → 对/错 (смесь гарантирована) */
    const truths1 = shuffle([true, true, false, false, Math.random() < 0.5]);
    const l1pics = takePics(5);
    const l1others = shuffle(pics.filter(x => !l1pics.some(y => y.id === x.id)));   /* подмены не повторяются */
    let l1k = 0;
    l1pics.forEach((p, ti) => {
      const truth = truths1[ti];
      const other = truth ? null : (l1others[l1k++] || pics[0]);   /* подмену берём только для ложных */
      qs.push({ sec: 'listening', part: 1, type: 'tf', say: truth ? p.h : other.h, pic: p.id, correct: truth ? 0 : 1 });
    });
    /* Слушание ч.2: предложение → выбрать картинку из 3 */
    const l2 = sentPool.slice(0, 5);
    for (const it of l2) {
      const wrong = shuffle(pics.filter(p => p.id !== it.pic)).slice(0, 2);
      const opts = shuffle([it.pic, ...wrong.map(w => w.id)]);
      qs.push({ sec: 'listening', part: 2, type: 'pickpic', say: it.say, pics: opts, correct: opts.indexOf(it.pic) });
    }
    /* Слушание ч.3: диалог → картинка */
    for (const it of dlgPool.slice(0, 5)) {
      const wrong = shuffle(pics.filter(p => p.id !== it.pic)).slice(0, 2);
      const opts = shuffle([it.pic, ...wrong.map(w => w.id)]);
      qs.push({ sec: 'listening', part: 3, type: 'pickpic', say: [it.a, it.b], pics: opts, correct: opts.indexOf(it.pic) });
    }
    /* Слушание ч.4: вопрос → выбрать ответ (текст) */
    for (const it of pick(B.QA4, 5, 'e1:QA4')) {
      const order = shuffle([0, 1, 2]);
      qs.push({ sec: 'listening', part: 4, type: 'opts', say: it.say, opts: order.map(i => it.opts[i]), correct: order.indexOf(0) });
    }
    /* Чтение ч.1: картинка + слово → 对/错 (смесь гарантирована) */
    const truthsR = shuffle([true, true, false, false, Math.random() < 0.5]);
    const r1pics = takePics(5);
    const r1others = shuffle(pics.filter(x => !r1pics.some(y => y.id === x.id)));   /* подмены не повторяются */
    let r1k = 0;
    r1pics.forEach((p, ti) => {
      const truth = truthsR[ti];
      const w = truth ? p : (r1others[r1k++] || pics[0]);   /* подмену берём только для ложных */
      qs.push({ sec: 'reading', part: 1, type: 'tf', text: w.h, textPy: w.py, pic: p.id, correct: truth ? 0 : 1 });
    });
    /* Чтение ч.2: предложение (текстом) → картинка */
    const r2 = sentPool.slice(5, 10);
    for (const it of r2) {
      const wrong = shuffle(pics.filter(p => p.id !== it.pic)).slice(0, 2);
      const opts = shuffle([it.pic, ...wrong.map(w => w.id)]);
      qs.push({ sec: 'reading', part: 2, type: 'pickpic', text: it.say, pics: opts, correct: opts.indexOf(it.pic) });
    }
    /* Чтение ч.3: вопрос ↔ ответ, общий пул из 6 */
    const qa = pick(B.QA3, 6, 'e1:QA3', x => x.a);
    const pool3 = shuffle(qa.map(x => x.a));
    qa.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 3, type: 'pool', block: 'e1r3', text: it.q, pool: pool3, answer: it.a }));
    /* Чтение ч.4: пропуск ↔ слово, общий пул из 6 */
    const fills = pick(B.FILL, 6, 'e1:FILL', x => x.ans);
    const pool4 = shuffle(fills.map(x => x.ans));
    fills.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 4, type: 'pool', block: 'e1r4', text: it.t, pool: pool4, answer: it.ans }));
    flushSeen();
    return qs;
  }

  /* Экзамен HSK 2: 听力 35 (4 части) + 阅读 25 (4 части) */
  function buildExam2() {
    const B = window.HSK2EXAM;
    const av = new Set((window.PICS_AVAILABLE || []));
    const pics = shuffle(availPics());
    const sentPool = pick(B.SENT.filter(x => av.has(x.pic)), 15, 'e2:SENT');
    const dlgPool = pick(B.DLG.filter(x => av.has(x.pic)), 10, 'e2:DLG');
    if (sentPool.length < 15 || dlgPool.length < 10) throw new Error('Мало картинок для экзамена HSK 2');
    const qs = [];
    /* 听力 ч.1 (10): предложение + картинка → 对/错 (5 верных + 5 неверных) */
    const truths2 = shuffle([true, true, true, true, true, false, false, false, false, false]);
    const l1set = sentPool.slice(0, 10);
    const l1alt = pick(B.SENT.filter(x => !l1set.some(y => y.say === x.say) && !sentPool.slice(10, 15).some(y => y.say === x.say)), 5, 'e2:ALT');
    let l2k = 0;
    l1set.forEach((it, ti) => {
      const truth = truths2[ti];
      const other = truth ? null : (l1alt[l2k++] || l1alt[0]);   /* подмену берём только для ложных: без повторов и не из чтения */
      qs.push({ sec: 'listening', part: 1, type: 'tf', say: truth ? it.say : other.say, pic: it.pic, correct: truth ? 0 : 1 });
    });
    /* 听力 ч.2 (10 = 2 блока по 5): диалог → картинка из пула 6 */
    for (let b = 0; b < 2; b++) {
      const block = dlgPool.slice(b * 5, b * 5 + 5);
      const extra = shuffle(pics.filter(p => !block.some(x => x.pic === p.id)))[0];
      const pool = shuffle([...block.map(x => x.pic), extra.id]);
      for (const it of block) qs.push({ sec: 'listening', part: 2, type: 'poolpic', block: 'e2l2' + b, say: [it.a, it.b], pool, answer: it.pic });
    }
    /* 听力 ч.3 (10): диалог + вопрос → 3 варианта */
    for (const it of pick(B.Q3, 10, 'e2:Q3')) {
      const order = shuffle([0, 1, 2]);
      qs.push({ sec: 'listening', part: 3, type: 'opts', say: it.say, opts: order.map(i => it.opts[i]), correct: order.indexOf(0) });
    }
    /* 听力 ч.4 (5): длинный диалог + вопрос */
    for (const it of pick(B.Q4, 5, 'e2:Q4')) {
      const order = shuffle([0, 1, 2]);
      qs.push({ sec: 'listening', part: 4, type: 'opts', say: it.say, opts: order.map(i => it.opts[i]), correct: order.indexOf(0) });
    }
    /* 阅读 ч.1 (5): предложение (текст) → картинка из пула 6 */
    const r1 = sentPool.slice(10, 15);
    {
      const extra = shuffle(pics.filter(p => !r1.some(x => x.pic === p.id)))[0];
      const pool = shuffle([...r1.map(x => x.pic), extra.id]);
      for (const it of r1) qs.push({ sec: 'reading', part: 1, type: 'poolpic', block: 'e2r1', text: it.say, pool, answer: it.pic });
    }
    /* 阅读 ч.2 (5): пропуск ↔ слово из пула 6 */
    const fills = pick(B.FILL, 6, 'e2:FILL', x => x.ans);
    const pool2 = shuffle(fills.map(x => x.ans));
    fills.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 2, type: 'pool', block: 'e2r2', text: it.t, pool: pool2, answer: it.ans }));
    /* 阅读 ч.3 (5): текст + суждение ★ → 对/错 */
    const tf5 = [...pick(B.TF.filter(x => x.truth), 3, 'e2:TFy'), ...pick(B.TF.filter(x => !x.truth), 2, 'e2:TFn')];
    for (const it of shuffle(tf5)) qs.push({ sec: 'reading', part: 3, type: 'tf', text: it.text, star: it.star, correct: it.truth ? 0 : 1 });
    /* 阅读 ч.4 (10 = 2 блока по 5): реплика ↔ ответ из пула 6 */
    const pairs = pick(B.PAIR, 12, 'e2:PAIR', x => x.a);
    for (let b = 0; b < 2; b++) {
      const block = pairs.slice(b * 6, b * 6 + 6);
      const pool = shuffle(block.map(x => x.a));
      block.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 4, type: 'pool', block: 'e2r4' + b, text: it.q, pool, answer: it.a }));
    }
    flushSeen();
    return qs;
  }

  /* Экзамен HSK 3: 听力 40 + 阅读 30 + 书写 10 */
  function buildExam3() {
    const B = window.HSK3EXAM;
    const av = new Set(window.PICS_AVAILABLE || []);
    const pics = shuffle(availPics());
    const dlgPool = pick(B.DLG.filter(x => av.has(x.pic)), 10, 'e3:DLG');
    if (dlgPool.length < 10) throw new Error('Мало картинок для экзамена HSK 3');
    const qs = [];
    /* 听力 ч.1 (10 = 2 блока по 5): диалог → картинка из пула 6 */
    for (let b = 0; b < 2; b++) {
      const block = dlgPool.slice(b * 5, b * 5 + 5);
      const extra = shuffle(pics.filter(p => !block.some(x => x.pic === p.id)))[0];
      const pool = shuffle([...block.map(x => x.pic), extra.id]);
      for (const it of block) qs.push({ sec: 'listening', part: 1, type: 'poolpic', block: 'e3l1' + b, say: [it.a, it.b], pool, answer: it.pic });
    }
    /* 听力 ч.2 (10): высказывание на слух + суждение ★ (5 верных + 5 неверных) */
    const tfl = [...pick(B.TFL.filter(x => x.truth), 5, 'e3:TFLy'), ...pick(B.TFL.filter(x => !x.truth), 5, 'e3:TFLn')];
    for (const it of shuffle(tfl)) qs.push({ sec: 'listening', part: 2, type: 'tf', say: it.say, star: it.star, correct: it.truth ? 0 : 1 });
    /* 听力 ч.3 (10) и ч.4 (10): диалоги с вопросом */
    for (const it of pick(B.Q3, 10, 'e3:Q3')) { const o = shuffle([0, 1, 2]); qs.push({ sec: 'listening', part: 3, type: 'opts', say: it.say, opts: o.map(i => it.opts[i]), correct: o.indexOf(0) }); }
    for (const it of pick(B.Q4, 10, 'e3:Q4')) { const o = shuffle([0, 1, 2]); qs.push({ sec: 'listening', part: 4, type: 'opts', say: it.say, opts: o.map(i => it.opts[i]), correct: o.indexOf(0) }); }
    /* 阅读 ч.1 (10 = 2 блока по 5): реплика ↔ ответ */
    const pairs = pick(B.PAIR, 12, 'e3:PAIR', x => x.a);
    for (let b = 0; b < 2; b++) {
      const block = pairs.slice(b * 6, b * 6 + 6);
      const pool = shuffle(block.map(x => x.a));
      block.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 1, type: 'pool', block: 'e3r1' + b, text: it.q, pool, answer: it.a }));
    }
    /* 阅读 ч.2 (10 = 2 блока по 5): пропуски */
    const fills = pick(B.FILL, 12, 'e3:FILL', x => x.ans);
    for (let b = 0; b < 2; b++) {
      const block = fills.slice(b * 6, b * 6 + 6);
      const pool = shuffle(block.map(x => x.ans));
      block.slice(0, 5).forEach(it => qs.push({ sec: 'reading', part: 2, type: 'pool', block: 'e3r2' + b, text: it.t, pool, answer: it.ans }));
    }
    /* 阅读 ч.3 (10): текст + вопрос */
    for (const it of pick(B.READ, 10, 'e3:READ')) { const o = shuffle([0, 1, 2]); qs.push({ sec: 'reading', part: 3, type: 'opts', text: it.t, sub: it.q, opts: o.map(i => it.opts[i]), correct: o.indexOf(0) }); }
    /* 书写 ч.1 (5): собрать предложение; ч.2 (5): написать иероглиф */
    for (const it of pick(B.ARRANGE, 5, 'e3:ARRANGE')) qs.push({ sec: 'writing', part: 1, type: 'arrange', chunks: shuffle(it.chunks), answers: it.a });
    for (const it of pick(B.WRITE, 5, 'e3:WRITE')) qs.push({ sec: 'writing', part: 2, type: 'input', text: it.t, py: it.py, answer: it.ans });
    flushSeen();
    return qs;
  }

  /* Подсчёт: каждая секция из 100 */
  function score(questions, spec) {
    const out = { sections: {}, score: 0 };
    for (const sec of Object.keys((spec || SPEC1).sections)) {
      const qs = questions.filter(q => q.sec === sec);
      const correct = qs.filter(q => q.ok).length;
      const pts = qs.length ? Math.round(correct / qs.length * 100) : 0;
      out.sections[sec] = { correct, total: qs.length, points: pts };
      out.score += pts;
    }
    out.passed = out.score >= (spec || SPEC1).pass;
    return out;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-go],[data-action],[data-back],[data-close]');
    if (!el || el.disabled) return;
    if (!el.hasAttribute('data-nosound')) Sound.click();
    if (el.hasAttribute('data-close')) { e.preventDefault(); closeSheet(); return; }
    if (el.hasAttribute('data-back')) { e.preventDefault(); back(); return; }
    if (el.dataset.go) {
      e.preventDefault();
      let p = {};
      try { p = el.dataset.params ? JSON.parse(el.dataset.params) : {}; } catch (err) { p = {}; }
      closeSheet();
      nav(el.dataset.go, p, { replace: el.hasAttribute('data-replace') });
      return;
    }
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  /* ── экспорт / импорт ── */
  function exportData() {
    return { app: 'zika', version: VERSION, schema: Vault.SCHEMA, exportedAt: new Date().toISOString(), settings: state.settings, decks: state.decks, cards: state.cards, attempts: state.attempts, campaign: state.campaign, meta: state.meta };
  }
  async function shareJSON(obj, name) {
    const text = JSON.stringify(obj, null, 1);
    try {
      const file = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    return downloadText(text, name, 'application/json');
  }
  function downloadText(text, name, type = 'text/plain') {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      return true;
    } catch (e) { toast('Не удалось сохранить файл'); return false; }
  }
  async function importData(obj, mode) {
    if (!obj || obj.app !== 'zika') throw new Error('Это не файл резервной копии 字卡');
    const decks = Array.isArray(obj.decks) ? obj.decks : [], cards = Array.isArray(obj.cards) ? obj.cards : [], attempts = Array.isArray(obj.attempts) ? obj.attempts : [];
    if (mode === 'replace') {
      state.decks = decks; state.cards = cards; state.attempts = attempts.slice().sort((a, b) => a.ts - b.ts);
      await Store.clearAttempts(); await Store.putAttempts(state.attempts);
    } else {
      const dIds = new Set(state.decks.map(d => d.id)), cIds = new Set(state.cards.map(c => c.id)), aIds = new Set(state.attempts.map(a => a.id));
      decks.forEach(d => { if (!dIds.has(d.id)) state.decks.push(d); });
      cards.forEach(c => { if (!cIds.has(c.id)) state.cards.push(c); });
      const newA = attempts.filter(a => !aIds.has(a.id));
      state.attempts.push(...newA); state.attempts.sort((a, b) => a.ts - b.ts);
      await Store.putAttempts(newA);
    }
    if (obj.settings) Object.assign(state.settings, obj.settings);
    if (obj.campaign && (mode === 'replace' || !state.campaign || (obj.campaign.days || 0) > (state.campaign.days || 0))) state.campaign = obj.campaign;
    if ((obj.schema || 1) < Vault.SCHEMA) { const ctx = { meta: { schema: obj.schema || 1 }, settings: state.settings, decks: state.decks, cards: state.cards, attempts: state.attempts, campaign: state.campaign }; await Vault.migrate(ctx); }
    if (!state.campaign) state.campaign = Campaign.create();
    Campaign.process(state.campaign, state.attempts);
    reindex(); state.cardStats = Stats.cardStats(state.attempts); applyTheme(); Sound.setEnabled(state.settings.sound); persist();
    return { decks: decks.length, cards: cards.length, attempts: attempts.length };
  }

      if (!t.done && new Date().getHours() >= 12 && state.campaign && state.campaign.startedAt) navigator.setAppBadge(1);
      else navigator.clearAppBadge && navigator.clearAppBadge();
    } catch (e) { /* ignore */ }
  }

  function resultPanel(a, ev) {

  }
  App.Profile = { info, todayBar, dayBar, dots, showRankUp, homePanel, resultPanel, avatarButton };
})();

;
/* Статистика: обзор с графиками и разрезами, карточки, журнал попыток, разбор попытки. */
(() => {
  const { state, views, actions, nav, esc, attr, $, toast, sheet, closeSheet, confirm, LABELS, fmt, allDecks, deckById, cardIndex, hskCards, accClass, attemptRow, questionRow, render } = App;

  function tile(v, l, small) { return `<div class="tile"><div class="v">${v}${small ? `<small> ${small}</small>` : ''}</div><div class="l">${l}</div></div>`; }
  function barChart(data, valueFn, { max = 100, suffix = '', labelEvery = 5 } = {}) {
    const W = 320, H = 110, pad = 4, bw = (W - pad * 2) / data.length;
    const bars = data.map((d, i) => {
      const v = valueFn(d); if (v == null) return `<rect x="${pad + i * bw + 1}" y="${H - 22}" width="${Math.max(1, bw - 2)}" height="2" fill="var(--line-2)"/>`;
      const h = Math.max(2, (H - 26) * Math.min(1, v / max)), y = H - 22 - h;
      const col = suffix === '%' ? (v >= 80 ? 'var(--jade)' : v >= 60 ? 'var(--gold)' : 'var(--vermilion)') : 'var(--bordeaux)';
      return `<rect x="${pad + i * bw + 1}" y="${y}" width="${Math.max(1, bw - 2)}" height="${h}" rx="1.5" fill="${col}"/>`;
    }).join('');
    const labels = data.map((d, i) => (i % labelEvery === data.length % labelEvery || i === data.length - 1) ? `<text x="${pad + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9" fill="var(--ink-3)">${d.day}</text>` : '').join('');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${bars}${labels}</svg>`;
  }
  function table(rows, cols) {
    if (!rows.length) return '<div class="empty">Нет данных</div>';
    return `<div style="overflow-x:auto"><table class="table"><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  const pctCell = v => `<span class="badge ${accClass(v)}">${v}%</span>`;
  const GROUP_COLS = [{ h: '', f: r => esc(r.label) }, { h: 'Попыток', num: true, f: r => r.n }, { h: 'Средний', num: true, f: r => pctCell(r.avgPercent) }, { h: 'Балл', num: true, f: r => r.avgScore }, { h: 'Лучший', num: true, f: r => r.best + '%' }, { h: 'Время', num: true, f: r => fmt.clock(r.timeMs) }];

  function overview() {
    const A = state.attempts, ov = Stats.overview(A);
    if (!A.length) return '<div class="empty">Пока нет попыток — статистика появится после первой тренировки или теста.</div>';
    const cs = state.cardStats, seen = Object.keys(cs).length, mastered = Object.values(cs).filter(s => s.mastered).length;
    const problem = Object.entries(cs).filter(([id, s]) => s.asked >= 2 && s.accuracy < 0.6 && cardIndex[id]).sort((a, b) => a[1].accuracy - b[1].accuracy || b[1].asked - a[1].asked).slice(0, 8);
    const daily = Stats.daily(A, 30);
    const week = A.filter(a => Date.now() - a.ts < 7 * 864e5), wk = Stats.overview(week);
    const dirLabel = a => a.show === 'mixed' ? 'Смешанно' : a.show === 'exam' ? 'Экзамен HSK' : (LABELS.part[a.show] || a.show) + ' → ' + (a.guess || []).map(p => LABELS.part[p] || p).join('+');
    const hskRows = [1, 2, 3].map(l => { const t = A.filter(a => a.mode === 'hsk' && a.level === l); if (!t.length) return null; const g = Stats.groupBy(t, () => l, () => 'HSK ' + l)[0]; return g; }).filter(Boolean);
    return `
    <div class="tiles">
      ${tile(ov.attempts, 'попыток всего')}${tile(ov.avgPercent + '%', 'средний результат')}
      ${tile(ov.avgScore, 'средний балл')}${tile(ov.best + '%', 'лучший результат', 'мин. ' + ov.worst + '%')}
      ${tile(ov.streak, 'дней подряд', 'рекорд ' + ov.bestStreak)}${tile(ov.days, 'дней с занятиями')}
      ${tile(ov.questions, 'вопросов', 'верно ' + ov.correct)}${tile(fmt.dur(ov.timeMs), 'общее время', fmt.secs(ov.avgQuestionMs) + '/вопрос')}
      ${tile(seen, 'карточек встречалось', 'из ' + (hskCards.length + state.cards.length))}${tile(mastered, 'освоено', '3+ верных подряд')}
      ${tile(wk.attempts, 'попыток за 7 дней', wk.attempts ? wk.avgPercent + '%' : '')}${tile(ov.passed + '/' + ov.hskTests, 'HSK сдано / тестов')}
    </div>
    <div class="panel"><div class="chart"><div class="chart-t"><span>Результат по дням</span><span>30 дней</span></div>${barChart(daily, d => d.avgPercent, { max: 100, suffix: '%' })}</div>
      <div class="chart mt"><div class="chart-t"><span>Вопросов по дням</span><span>макс. ${Math.max(...daily.map(d => d.questions))}</span></div>${barChart(daily, d => d.questions || null, { max: Math.max(10, ...daily.map(d => d.questions)) })}</div></div>
    <h2 class="h2">По колодам</h2>${table(Stats.groupBy(A, a => a.deckName, a => a.deckName), GROUP_COLS)}
    <h2 class="h2">По сложности</h2>${table(Stats.groupBy(A, a => a.difficulty, a => LABELS.diff[a.difficulty] || a.difficulty), GROUP_COLS)}
    <h2 class="h2">По режиму</h2>${table(Stats.groupBy(A, a => a.mode, a => LABELS.mode[a.mode] || a.mode), GROUP_COLS)}
    <h2 class="h2">По направлению</h2>${table(Stats.groupBy(A, dirLabel, dirLabel), GROUP_COLS)}
    ${hskRows.length ? `<h2 class="h2">HSK-тесты</h2>${table(hskRows, [{ h: '', f: r => r.label }, { h: 'Тестов', num: true, f: r => r.n }, { h: 'Сдано', num: true, f: r => r.passed }, { h: 'Средний', num: true, f: r => pctCell(r.avgPercent) }, { h: 'Лучший', num: true, f: r => r.best + '%' }, { h: 'Последний', num: true, f: r => fmt.date(r.last) }])}` : ''}
    <h2 class="h2">Проблемные карточки</h2>
    ${problem.length ? problem.map(([id, s]) => cardRow(cardIndex[id], s)).join('') + `<div class="btns"><button class="btn btn-secondary btn-block" data-go="stats" data-params="${attr({ tab: 'cards', filter: 'problem' })}" data-replace>Все проблемные</button></div>` : '<div class="empty">Нет карточек с точностью ниже 60% (минимум 2 вопроса).</div>'}`;
  }
  function cardRow(c, s) {
    const acc = Math.round(s.accuracy * 100);
    return `<button class="row tap" data-action="stat-card" data-id="${c.id}"><div class="row-card"><span class="hanzi sm">${esc(c.hanzi)}</span><span class="pinyin sm">${esc(c.pinyin)}</span><div class="ru sm">${esc(c.ru)}</div></div><div class="row-r"><div style="text-align:right"><span class="badge ${accClass(acc)}">${acc}%</span><div class="row-s">${s.correct}/${s.asked} · серия ${s.streak}</div></div></div></button>`;
  }
  function cardsTab(p) {
    const filter = p.filter || 'all', deck = p.deck || 'all', q = (p.q || '').toLowerCase();
    const cs = state.cardStats;
    let list = Object.entries(cs).map(([id, s]) => [cardIndex[id], s]).filter(([c]) => c);
    if (deck !== 'all') list = list.filter(([c]) => c.deckId === deck);
    if (filter === 'problem') list = list.filter(([, s]) => s.accuracy < 0.6);
    else if (filter === 'mastered') list = list.filter(([, s]) => s.mastered);
    if (q) { const qs = Pinyin.stripTones(q); list = list.filter(([c]) => c.hanzi.includes(q) || Pinyin.stripTones(c.pinyin).toLowerCase().includes(qs) || c.ru.toLowerCase().includes(q)); }
    list.sort((a, b) => filter === 'mastered' ? b[1].streak - a[1].streak : a[1].accuracy - b[1].accuracy || b[1].asked - a[1].asked);
    const segBtn = (k, l) => `<button class="${filter === k ? 'on' : ''}" data-go="stats" data-params="${attr({ ...p, tab: 'cards', filter: k })}" data-replace>${l}</button>`;
    return `<div class="seg mb">${segBtn('all', 'Все')}${segBtn('problem', 'Проблемные')}${segBtn('mastered', 'Освоенные')}</div>
    <select class="inp mb" id="deck-filter"><option value="all">Все колоды</option>${allDecks().map(d => `<option value="${d.id}" ${deck === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
    <input class="inp search" id="card-q" placeholder="Поиск" value="${esc(p.q || '')}" autocomplete="off">
    <div class="hint" style="margin:8px 0">${fmt.plural(list.length, 'карточка', 'карточки', 'карточек')} · сортировка: ${filter === 'mastered' ? 'по серии' : 'сначала слабые'}</div>
    ${list.length ? list.slice(0, 200).map(([c, s]) => cardRow(c, s)).join('') : '<div class="empty">Ничего не найдено.</div>'}${list.length > 200 ? '<div class="hint">Показаны первые 200.</div>' : ''}`;
  }
  function logTab(p) {
    const mode = p.mode || 'all';
    let list = state.attempts.slice().reverse();
    if (mode !== 'all') list = list.filter(a => a.mode === mode);
    const segBtn = (k, l) => `<button class="chip ${mode === k ? 'on' : ''}" data-go="stats" data-params="${attr({ tab: 'log', mode: k })}" data-replace>${l}</button>`;
    return `<div class="chips mb">${segBtn('all', 'Все')}${segBtn('quiz', 'Тесты')}${segBtn('flip', 'Карточки')}${segBtn('write', 'Письмо')}${segBtn('listen', 'Аудио')}${segBtn('sentence', 'Фразы')}${segBtn('hsk', 'HSK')}</div>
    <div class="hint" style="margin:0 0 6px">${fmt.plural(list.length, 'попытка', 'попытки', 'попыток')} · каждая сохранена с ответами на все вопросы</div>
    ${list.length ? list.slice(0, 300).map(attemptRow).join('') : '<div class="empty">Пусто.</div>'}`;
  }
  /* Боссы: сколько кого повержено и сколько без подсказок */
  function bossTab() {
    const fights = state.attempts.filter(a => a.mode === 'boss');
    const rows = Boss.LIST.map(b => {
      const r = Boss.bs(state, b.id);
      const mine = fights.filter(a => a.boss === b.id);
      const best = mine.filter(a => a.won).length;
      return `<div class="panel boss-card"><img class="boss-por" src="${IMG_URL(b.img)}" alt="">
        <div class="grow"><div class="boss-n"><span class="zh">${esc(b.zh)}</span> · ${esc(b.ru)}</div>
        <div class="fb-row"><span class="fb-p">Побед</span><span class="fb-v"><b>${r.wins}</b></span></div>
        <div class="fb-row"><span class="fb-p">Из них без подсказок</span><span class="fb-v"><b>${r.clean}</b></span></div>
        <div class="fb-row"><span class="fb-p">Вызовов</span><span class="fb-v">${r.tries}</span></div>
        <div class="fb-row"><span class="fb-p">Доля побед</span><span class="fb-v">${r.tries ? Math.round(best / r.tries * 100) + '%' : '—'}</span></div>
        </div></div>`;
    }).join('');
    const tot = Boss.LIST.reduce((s2, b) => { const r = Boss.bs(state, b.id); s2.w += r.wins; s2.c += r.clean; s2.t += r.tries; return s2; }, { w: 0, c: 0, t: 0 });
    return `<div class="tiles t3"><div class="tile"><div class="v">${tot.w}</div><div class="l">${fmt.plural(tot.w, 'победа', 'победы', 'побед').replace(/^\d+ /, '')} всего</div></div><div class="tile"><div class="v">${tot.c}</div><div class="l">без подсказок</div></div><div class="tile"><div class="v">${tot.t}</div><div class="l">${fmt.plural(tot.t, 'вызов', 'вызова', 'вызовов').replace(/^\d+ /, '')}</div></div></div>${rows}`;
  }
  views.stats = {
    render(p) {
      const tab = p.tab || 'overview';
      const tabs = `<div class="seg top-seg">${[['overview', 'Обзор'], ['cards', 'Карточки'], ['boss', 'Боссы'], ['log', 'Журнал']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-go="stats" data-params="${attr({ tab: k })}" data-replace>${l}</button>`).join('')}</div>`;
      return `<div class="vh"><div class="seal">计</div><div class="grow"><h1 class="title">Статистика</h1><div class="sub">统计 · всё сохраняется подробно</div></div></div>${tabs}${tab === 'overview' ? overview() : tab === 'cards' ? cardsTab(p) : tab === 'boss' ? bossTab() : logTab(p)}`;
    },
    mount(p) {
      const df = $('#deck-filter'); if (df) df.addEventListener('change', () => nav('stats', { ...p, tab: 'cards', deck: df.value }, { replace: true }));
      const cq = $('#card-q'); if (cq) { let t; cq.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.params = { ...p, tab: 'cards', q: cq.value }; try { history.replaceState({ view: 'stats', params: state.params }, ''); } catch (e) { /* ignore */ } const pos = cq.selectionStart; render(); const n = $('#card-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }); }
    },
  };
  actions['stat-card'] = el => {
    const c = cardIndex[el.dataset.id], s = state.cardStats[c && c.id]; if (!c || !s) return;
    const hist = state.attempts.flatMap(a => (a.questions || []).filter(q => q.cardId === c.id).map(q => ({ ts: a.ts, q, mode: a.mode }))).reverse().slice(0, 12);
    sheet(`<div class="sh-card"><div class="hanzi mid ${c.hanzi.replace(/[…\s]/g, '').length >= 5 ? 'len5' : ''}">${esc(c.hanzi)}</div><div class="pinyin">${esc(c.pinyin)}</div><div class="ru">${esc(c.ru)}</div><div class="hint">${esc((deckById(c.deckId) || {}).name || '')}</div></div>
    <div class="tiles t3">${tile(s.asked, 'спрошено')}${tile(Math.round(s.accuracy * 100) + '%', 'точность')}${tile(s.streak, 'подряд верно')}</div>
    <div class="tiles t3">${tile(s.correct, 'верно')}${tile(s.partial, 'частично')}${tile(s.wrong, 'неверно')}</div>
    <div class="flabel">История</div>${hist.map(h => `<div class="fb-row"><span class="fb-p" style="min-width:96px">${fmt.date(h.ts)}</span><span class="fb-a ${h.q.ok ? 'exact' : h.q.fraction > 0 ? 'tones' : 'wrong'}" style="text-decoration:none">${h.q.ok ? 'верно' : h.q.fraction > 0 ? 'частично' : 'ошибка'}</span><span class="fb-v">${LABELS.part[h.q.show]} → ${(h.q.guess || []).map(x => LABELS.part[x]).join('+')}${h.q.ok ? '' : ' · ' + esc(App.answerText(h.q))}</span></div>`).join('')}`);
  };

  views.attempt = {
    render(p) {
      const a = state.attempts.find(x => x.id === p.id);
      if (!a) return '<div class="empty">Попытка не найдена</div>';
      const dir = a.show === 'mixed' ? 'смешанное направление' : a.show === 'exam' ? 'экзаменационный формат' + (a.examMax ? ', балл из ' + a.examMax : '') : LABELS.part[a.show] + ' → ' + (a.guess || []).map(x => LABELS.part[x]).join(' + ');
      return `<div class="vh"><button class="icon-btn" data-back>‹</button><div class="grow"><h1 class="title">${LABELS.mode[a.mode]}${a.level ? ' ' + a.level : ''}</h1><div class="sub">${fmt.date(a.ts)}${a.mode === 'hsk' ? '' : ' · ' + esc(a.deckName)}</div></div><button class="icon-btn" data-action="attempt-delete" data-id="${a.id}" aria-label="Удалить">🗑</button></div>
      <div class="tiles t3">${tile(a.percent + '%', 'результат')}${tile(a.score, 'балл')}${tile(fmt.dur(a.durationMs), 'время')}</div>
      <div class="tiles t3">${tile(a.correct, 'верно')}${tile(a.partial, 'частично')}${tile(a.wrong, 'неверно')}</div>
      <div class="panel"><div class="hint" style="margin:0">${a.mode !== 'flip' ? LABELS.diff[a.difficulty] + ' · ' : ''}${dir} · ${LABELS.order[a.order] || ''}${a.timer ? ' · таймер ' + a.timer + ' с' : ''} · ${fmt.secs(a.durationMs / a.total)} на вопрос${a.passed != null ? (a.passed ? ' · <b>сдан</b>' : ' · <b>не сдан</b>') : ''}${a.aborted ? ' · прервана на ' + a.total + ' из ' + a.planned : ''} · <b>+${Math.round(a.points != null ? a.points : Campaign.attemptPoints(a))} очк. похода</b></div></div>
      <h2 class="h2">Вопросы</h2>${a.questions.map(questionRow).join('')}
      <div class="btns"><button class="btn btn-secondary btn-block" data-action="retry-mistakes" data-id="${a.id}" ${a.questions.some(q => !q.ok) ? '' : 'disabled'}>Повторить ошибки</button></div>`;
    },
  };
  actions['attempt-delete'] = async el => {
    const a = state.attempts.find(x => x.id === el.dataset.id); if (!a) return;
    if (!await confirm('Удалить эту попытку из статистики?', { ok: 'Удалить', danger: true })) return;
    state.attempts = state.attempts.filter(x => x.id !== a.id); state.cardStats = Stats.cardStats(state.attempts);
    await Store.deleteAttempt(a.id); toast('Удалено'); nav('stats', { tab: 'log' }, { replace: true });
  };
})();

;App.boot();
